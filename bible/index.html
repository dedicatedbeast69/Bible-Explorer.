Je te pr\xE9sente mes besoins, mon travail et ceux que je vais rencontrer.
Apprends-moi \xE0 attendre avec esp\xE9rance, non avec inqui\xE9tude.
Dirige mes pas et r\xE9ponds selon ta volont\xE9 parfaite.
Garde mes yeux lev\xE9s vers toi \xE0 chaque heure.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:'Crosswalk \u2014 "10 Morning Verses to Start Your Day with God"; Guideposts \u2014 "12 Best Bible Prayers for the Morning"; RhemaOS morning prayer points',url:"https://www.crosswalk.com/faith/spiritual-life/morning-verses-to-start-your-day-with-god.html"},theme:"Bringing morning requests to God and watching for his answer"},{id:"am:guidance",title:{fr:"Fais-moi conna\xEEtre le chemin",en:"Show Me the Way I Should Go"},refs:["Psalm 143:8"],refsFr:["Psaumes 143:8"],text:{en:`Cause me to hear your lovingkindness in the morning, for in you I trust.
Make me know the way wherein I should walk, for I lift up my soul to you.
Where I am unsure, give clear guidance; where I am weary, renew my hope.
I entrust this day's decisions into your care.
Lead me on level ground and keep my heart soft to your voice.
In Jesus' name, amen.`,fr:`Fais-moi d\xE8s le matin entendre ta bont\xE9, car je me confie en toi.
Fais-moi conna\xEEtre le chemin o\xF9 je dois marcher, car j'\xE9l\xE8ve \xE0 toi mon \xE2me.
L\xE0 o\xF9 je doute, donne une direction claire ; l\xE0 o\xF9 je suis fatigu\xE9, renouvelle mon esp\xE9rance.
Je remets les d\xE9cisions de ce jour entre tes mains.
Conduis-moi sur un terrain uni et garde mon c\u0153ur attentif \xE0 ta voix.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:`Crosswalk morning verses; Desiring God \u2014 "Don't Waste Your Mornings" (Ps 143:8); Facebook public posts from YouVersion / Mount Gilead MBC quoting Ps 143:8`,url:"https://www.desiringgod.org/interviews/dont-waste-your-mornings"},theme:"Asking to hear God's love and receive guidance for the day's path"},{id:"am:satisfy",title:{fr:"Rassasie-nous de ta bont\xE9",en:"Satisfy Us with Your Love"},refs:["Psalm 90:14","Lamentations 3:22-24"],refsFr:["Psaumes 90:14","Lamentations 3:22-24"],text:{en:`O Lord, satisfy us early with your mercy, that we may rejoice and be glad all our days.
Fill my heart with your steadfast love before I chase lesser things.
You are my portion; therefore I hope in you.
Free me from measuring this day by success or approval.
Let joy in you outlast my circumstances from morning until night.
In Jesus' name, amen.`,fr:`\xC9ternel, rassasie-nous chaque matin de ta bont\xE9, et nous serons toute notre vie dans la joie et l'all\xE9gresse.
Remplis mon c\u0153ur de ton amour fid\xE8le avant que je coure apr\xE8s de moindres choses.
Tu es ma part ; c'est pourquoi j'esp\xE8re en toi.
Lib\xE8re-moi de juger cette journ\xE9e selon le succ\xE8s ou l'approbation.
Que la joie en toi dure plus que mes circonstances, du matin jusqu'au soir.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:'Desiring God \u2014 "Evaluate Your Day Before It Begins" (Matthew Westerholm on Psalm 90:14)',url:"https://www.desiringgod.org/articles/evaluate-your-day-before-it-begins"},theme:"Being satisfied by God's love at the start of the day so joy lasts"},{id:"am:strength",title:{fr:"Notre aide chaque matin",en:"Our Strength Every Morning"},refs:["Isaiah 33:2","Isaiah 40:31"],refsFr:["\xC9sa\xEFe 33:2","\xC9sa\xEFe 40:31"],text:{en:`O Lord, be gracious to us; we have waited for you.
Be our arm every morning, our salvation in the time of trouble.
Those who wait upon you renew their strength; they shall run and not be weary.
I cannot face this day on my own power\u2014renew me now.
Help me walk without fainting and work without despair.
Be my strength from the first hour to the last.
In Jesus' name, amen.`,fr:`\xC9ternel, aie piti\xE9 de nous ! Nous esp\xE9rons en toi.
Sois notre aide chaque matin, et notre d\xE9livrance au temps de la d\xE9tresse.
Ceux qui se confient en toi renouvellent leur force ; ils courent et ne se lassent point.
Je ne peux pas affronter ce jour par ma seule force \u2014 renouvelle-moi maintenant.
Aide-moi \xE0 marcher sans me fatiguer et \xE0 travailler sans d\xE9sesp\xE9rer.
Sois ma force de la premi\xE8re heure \xE0 la derni\xE8re.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:'Guideposts \u2014 "12 Best Bible Prayers for the Morning" (Isa 33:2); Crosswalk morning verses (Isa 40:31)',url:"https://guideposts.org/articles/prayer/how-to-pray/12-best-bible-prayers-for-the-morning/"},theme:"Asking God to be daily strength and renewed power for the weary"},{id:"am:thisday",title:{fr:"Le jour que l'\xC9ternel a fait",en:"This Is the Day the Lord Has Made"},refs:["Psalm 118:24"],refsFr:["Psaumes 118:24"],text:{en:`This is the day which the Lord has made; I will rejoice and be glad in it.
Thank you for waking me and giving me another day of life.
I choose gladness not because everything is easy, but because you made this day.
Help me notice your gifts and refuse a bitter spirit.
Let gratitude shape my words and my work.
In Jesus' name, amen.`,fr:`C'est ici la journ\xE9e que l'\xC9ternel a faite : qu'elle soit pour nous un sujet d'all\xE9gresse et de joie.
Merci de m'avoir r\xE9veill\xE9 et de me donner encore un jour de vie.
Je choisis la joie non parce que tout est facile, mais parce que tu as fait ce jour.
Aide-moi \xE0 voir tes dons et \xE0 refuser un esprit amer.
Que la reconnaissance forme mes paroles et mon travail.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web+x",source:"Christianity.com morning Bible verses; Pace with Grace morning-prayer page; X post @mfabrouce quoting Psalm 118:24 KJV",url:"https://www.christianity.com/bible/bible-verses-for-morning-97"},theme:"Choosing gladness because God made this day"},{id:"am:sing",title:{fr:"Je chanterai ta bont\xE9",en:"I Will Sing of Your Mercy"},refs:["Psalm 59:16"],refsFr:["Psaumes 59:17"],text:{en:`But I will sing of your power; yes, I will sing aloud of your mercy in the morning.
You have been my defence and refuge in the day of my trouble.
Even if worry waits for me, I begin with praise.
Be my fortress today; shut out the voice of fear.
Let a song of your love rise before my plans do.
In Jesus' name, amen.`,fr:`Et moi, je chanterai ta force ; d\xE8s le matin, je c\xE9l\xE9brerai ta bont\xE9.
Car tu es pour moi une haute retraite, un refuge au jour de ma d\xE9tresse.
M\xEAme si l'inqui\xE9tude m'attend, je commence par la louange.
Sois ma forteresse aujourd'hui ; fais taire la voix de la peur.
Que le chant de ton amour s'\xE9l\xE8ve avant mes plans.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:'Crosswalk \u2014 "10 Morning Verses"; Christianity.com top morning verses; Pace with Grace (Ps 59:16)',url:"https://www.crosswalk.com/faith/spiritual-life/morning-verses-to-start-your-day-with-god.html"},theme:"Starting the morning with praise for God's strength and refuge"},{id:"am:words",title:{fr:"Paroles et m\xE9ditation",en:"Words and Meditation Acceptable"},refs:["Psalm 19:14"],refsFr:["Psaumes 19:15"],text:{en:`Let the words of my mouth, and the meditation of my heart, be acceptable in your sight,
O Lord, my strength and my redeemer.
Guard my tongue from haste, gossip, and harshness today.
Cleanse my thoughts before they become words.
May what I say and what I silently dwell on honor you.
Be my rock when my heart wanders.
In Jesus' name, amen.`,fr:`Re\xE7ois favorablement les paroles de ma bouche et les sentiments de mon c\u0153ur,
\xF4 \xC9ternel, mon rocher et mon lib\xE9rateur.
Garde ma langue de la pr\xE9cipitation, des m\xE9disances et de la duret\xE9 aujourd'hui.
Purifie mes pens\xE9es avant qu'elles ne deviennent des paroles.
Que ce que je dis et ce que je m\xE9dite en silence t'honore.
Sois mon rocher quand mon c\u0153ur s'\xE9gare.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:'Guideposts \u2014 "12 Best Bible Prayers for the Morning" (Ps 19:14); Bible Study Tools morning verse lists',url:"https://guideposts.org/articles/prayer/how-to-pray/12-best-bible-prayers-for-the-morning/"},theme:"Asking that speech and inner thoughts please the Lord"},{id:"am:trust",title:{fr:"Confiance de tout mon c\u0153ur",en:"Trust with All My Heart"},refs:["Proverbs 3:5-6"],refsFr:["Proverbes 3:5-6"],text:{en:`Lord, I trust in you with all my heart; I will not lean on my own understanding.
In all my ways I acknowledge you\u2014direct my paths today.
Where I want control, teach me surrender.
Where I am confused, straighten what is crooked.
I submit my plans, conversations, and choices to you.
Make my way plain as I walk with you.
In Jesus' name, amen.`,fr:`Seigneur, je me confie en toi de tout mon c\u0153ur ; je ne m'appuie pas sur ma sagesse.
Je te reconnais dans toutes mes voies \u2014 aplanis mes sentiers aujourd'hui.
L\xE0 o\xF9 je veux contr\xF4ler, enseigne-moi l'abandon.
L\xE0 o\xF9 je suis confus, redresse ce qui est tortueux.
Je soumets mes plans, mes conversations et mes choix \xE0 toi.
Rends mon chemin clair tandis que je marche avec toi.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:'Crosswalk \u2014 "10 Morning Verses to Start Your Day with God" (Prov 3:5-6)',url:"https://www.crosswalk.com/faith/spiritual-life/morning-verses-to-start-your-day-with-god.html"},theme:"Wholehearted trust and acknowledging God in every path"},{id:"am:kingdom",title:{fr:"Cherchez premi\xE8rement",en:"Seek First His Kingdom"},refs:["Matthew 6:33-34"],refsFr:["Matthieu 6:33-34"],text:{en:`Father, I seek first your kingdom and your righteousness this morning.
Before I chase needs and worries, I set my heart on you.
You promised that all these things shall be added; I trust your provision.
I will not take anxious thought for tomorrow\u2014today has enough.
Help me choose what honors you when my schedule pulls me elsewhere.
Keep my priorities ordered under your rule.
In Jesus' name, amen.`,fr:`P\xE8re, je cherche premi\xE8rement ton royaume et ta justice ce matin.
Avant de courir apr\xE8s mes besoins et mes soucis, je fixe mon c\u0153ur sur toi.
Tu as promis que toutes ces choses seront donn\xE9es par-dessus ; je fais confiance \xE0 ta provision.
Je ne m'inqui\xE8te pas du lendemain \u2014 \xE0 chaque jour suffit sa peine.
Aide-moi \xE0 choisir ce qui t'honore quand mon emploi du temps m'entra\xEEne ailleurs.
Garde mes priorit\xE9s ordonn\xE9es sous ton r\xE8gne.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk morning verses (Matt 6:33); Christianity.com morning verse collection",url:"https://www.crosswalk.com/faith/spiritual-life/morning-verses-to-start-your-day-with-god.html"},theme:"Putting God's kingdom first and releasing tomorrow's anxiety"},{id:"am:peace",title:{fr:"Paix qui surpasse",en:"Peace That Guards My Heart"},refs:["Philippians 4:6-7"],refsFr:["Philippiens 4:6-7"],text:{en:`Lord, I will be careful for nothing; by prayer and thanksgiving I make my requests known to you.
I bring you every worry that woke with me this morning.
Let the peace of God, which passes all understanding, keep my heart and mind through Christ Jesus.
Guard me from spiraling thoughts and restless fear.
Replace anxiety with grateful trust as I step into this day.
In Jesus' name, amen.`,fr:`Seigneur, je ne m'inqui\xE8te de rien ; par la pri\xE8re et les actions de gr\xE2ces, je te fais conna\xEEtre mes besoins.
Je t'apporte chaque souci qui s'est r\xE9veill\xE9 avec moi ce matin.
Que la paix de Dieu, qui surpasse toute intelligence, garde mon c\u0153ur et mes pens\xE9es en J\xE9sus-Christ.
Prot\xE8ge-moi des pens\xE9es qui tournent en boucle et de la peur inqui\xE8te.
Remplace l'anxi\xE9t\xE9 par une confiance reconnaissante en entrant dans ce jour.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk morning verses (Phil 4:6-7); Christianity.com; Bible Study Tools morning prayer articles",url:"https://www.crosswalk.com/faith/spiritual-life/morning-verses-to-start-your-day-with-god.html"},theme:"Trading morning anxiety for prayer, thanksgiving, and God's peace"},{id:"am:solitary",title:{fr:"Comme J\xE9sus au matin",en:"As Jesus Prayed Before Dawn"},refs:["Mark 1:35","Isaiah 50:4"],refsFr:["Marc 1:35","\xC9sa\xEFe 50:4"],text:{en:`Lord Jesus, in the morning, rising a great while before day, you went to a solitary place and prayed.
Wake my ear morning by morning to hear as a disciple.
Give me a quiet place\u2014even a few minutes\u2014before the demands begin.
Teach me to listen more than I speak, and to follow more than I rush.
Shape my words today so they can sustain the weary.
I meet you first, then I face the day.
Amen.`,fr:`Seigneur J\xE9sus, vers le matin, pendant qu'il faisait encore tr\xE8s sombre, tu t'es lev\xE9 et tu es all\xE9 dans un lieu d\xE9sert pour prier.
\xC9veille mon oreille chaque matin pour que j'\xE9coute comme un disciple.
Donne-moi un lieu tranquille \u2014 m\xEAme quelques minutes \u2014 avant que les exigences commencent.
Apprends-moi \xE0 \xE9couter plus qu'\xE0 parler, et \xE0 suivre plus qu'\xE0 me pr\xE9cipiter.
Forme mes paroles aujourd'hui pour qu'elles puissent soutenir celui qui est abattu.
Je te rencontre d'abord, puis j'affronte le jour.
Amen.`},inspiredBy:{platform:"web",source:"Pace with Grace \u2014 morning prayer verses (Mark 1:35); RhemaOS morning points (Isa 50:4); Guideposts list",url:"https://www.pacewithgrace.org/bible-verses/prayer/in-the-morning"},theme:"Following Jesus' example of early solitary prayer and a listening ear"},{id:"am:joy",title:{fr:"Le matin l'all\xE9gresse",en:"Joy Comes in the Morning"},refs:["Psalm 30:5"],refsFr:["Psaumes 30:6"],text:{en:`Father, your anger endures but a moment; in your favour is life.
Weeping may endure for a night, but joy comes in the morning.
If tears marked yesterday, meet me with gladness today.
Turn my mourning into hope without denying my pain.
Let your favour, not my fear, define this sunrise.
I receive the joy you send with the morning light.
In Jesus' name, amen.`,fr:`P\xE8re, ta col\xE8re dure un instant, mais ta gr\xE2ce toute la vie.
Le soir arrivent les pleurs, et le matin l'all\xE9gresse.
Si les larmes ont marqu\xE9 hier, accueille-moi avec la joie aujourd'hui.
Change mon deuil en esp\xE9rance sans nier ma peine.
Que ta faveur, non ma peur, d\xE9finisse ce lever du soleil.
Je re\xE7ois la joie que tu envoies avec la lumi\xE8re du matin.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:'Crosswalk morning verses; Bible Study Tools \u2014 "7 Powerful Morning Prayers" (cites Ps 30:5 with Lam 3:22-23); Christianity.com',url:"https://www.biblestudytools.com/bible-study/topical-studies/encouraging-morning-prayers-to-center-your-day-in-the-lord.html"},theme:"Hope that night sorrow gives way to morning joy in God's favor"},{id:"am:refuge",title:{fr:"Mon refuge ce matin",en:"My Refuge This Morning"},refs:["Psalm 91:1-2","Psalm 5:3"],refsFr:["Psaumes 91:1-2","Psaumes 5:4"],text:{en:`He that dwells in the secret place of the most High shall abide under the shadow of the Almighty.
I say of the Lord: He is my refuge and my fortress; my God, in him will I trust.
In the morning I look up to you\u2014cover me as I go out.
Keep me from fear of what I cannot control.
Abide with me, and let me abide in you all day.
In Jesus' name, amen.`,fr:`Celui qui demeure sous l'abri du Tr\xE8s-Haut repose \xE0 l'ombre du Tout-Puissant.
Je dis \xE0 l'\xC9ternel : Mon refuge et ma forteresse, mon Dieu en qui je me confie.
Le matin je regarde vers toi \u2014 couvre-moi tandis que je sors.
Garde-moi de la peur de ce que je ne peux pas contr\xF4ler.
Demeure avec moi, et que je demeure en toi tout le jour.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:'Crosswalk \u2014 "A Psalm 91 Morning Prayer to Start Your Day Trusting God" (Linda Lyle); pairs Ps 91 with Ps 5:3',url:"https://www.crosswalk.com/faith/prayer/psalm-91-morning-prayer-begin-the-day-by-abiding-in-god.html"},theme:"Abiding in God as refuge and fortress at the start of the day"},{id:"am:bcp-grace",title:{fr:"Collecte pour la gr\xE2ce (BCP 1662)",en:"Collect for Grace (BCP 1662)"},refs:["Book of Common Prayer 1662 \u2014 Collect for Grace"],refsFr:["Livre de la pri\xE8re commune 1662 \u2014 Collecte pour la gr\xE2ce"],text:{en:"O Lord, our heavenly Father, Almighty and everlasting God, who hast safely brought us to the beginning of this day: Defend us in the same with thy mighty power; and grant that this day we fall into no sin, neither run into any kind of danger; but that all our doings may be ordered by thy governance, to do always that is righteous in thy sight; through Jesus Christ our Lord. Amen.",fr:"\xD4 Seigneur, notre P\xE8re c\xE9leste, Dieu tout-puissant et \xE9ternel, qui nous as conduits en s\xFBret\xE9 jusqu'au commencement de ce jour : D\xE9fends-nous en celui-ci par ta puissance ; et fais que ce jour nous ne tombions dans aucun p\xE9ch\xE9, ni ne courions aucun danger ; mais que toutes nos actions soient ordonn\xE9es par ton gouvernement, pour faire toujours ce qui est juste \xE0 tes yeux ; par J\xE9sus-Christ notre Seigneur. Amen."},inspiredBy:{platform:"web",source:"Church of England \u2014 Book of Common Prayer, Order for Morning Prayer, Third Collect for Grace (public domain 1662 text; modernized display page also hosts the same collect)",url:"https://www.churchofengland.org/liturgy/book-of-common-prayer/order-morning-prayer"},theme:"Classic morning collect: protection from sin and danger, doings ordered by God (public-domain quote)",publicDomainQuote:!0}]});var qf,Af=Xe(()=>{qf=[{id:"pm:peace",title:{fr:"Je me couche en paix",en:"I Lie Down in Peace"},refs:["Psalm 4:8"],refsFr:["Psaumes 4:9"],text:{en:`Lord, I will both lay me down in peace, and sleep: for you alone make me dwell in safety.
The day is done, and I release what I could not finish.
You alone are my safe dwelling; I do not have to keep watch over every fear.
Quiet my mind and let me rest in your care.
Watch over my home and those I love through the night.
In Jesus' name, amen.`,fr:`Seigneur, je me couche et je m'endors en paix, car toi seul me donnes la s\xE9curit\xE9 dans ma demeure.
Le jour est fini, et je d\xE9pose ce que je n'ai pas pu achever.
Toi seul es mon abri s\xFBr; je n'ai pas \xE0 surveiller chaque peur.
Calme mon esprit et laisse-moi reposer sous ta garde.
Veille cette nuit sur ma maison et sur ceux que j'aime.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web + X",source:"Guideposts \u2014 Scripture for Peaceful Sleep; Crosswalk \u2014 A Psalm for Peaceful Sleep (Psalm 4:8) and Your Nightly Prayer (Slumber and Song); X posts quoting Ps 4:8 as a bedtime prayer (e.g. @pennedgraceapp, @TinoOjeda, @TheRealEvelynK)",url:"https://guideposts.org/daily_devotional/scripture-for-peaceful-sleep/"},theme:"Peaceful sleep and safety in God alone"},{id:"pm:incense",title:{fr:"Comme l'offrande du soir",en:"As the Evening Sacrifice"},refs:["Psalm 141:2"],refsFr:["Psaumes 141:2"],text:{en:`Let my prayer be set forth before you as incense, and the lifting up of my hands as the evening sacrifice.
I offer you this day's work, its joys, and its failures.
Receive what is good, and cover what was poorly done with your mercy.
May this closing hour be a true offering, not only a habit.
I lift my hands and my heart to you as night begins.
In Jesus' name, amen.`,fr:`Que ma pri\xE8re soit devant ta face comme l'encens, et l'\xE9l\xE9vation de mes mains comme l'offrande du soir.
Je te pr\xE9sente le travail de ce jour, ses joies et ses manques.
Re\xE7ois ce qui est bon, et couvre de ta mis\xE9ricorde ce qui a \xE9t\xE9 mal fait.
Que cette heure de cl\xF4ture soit une vraie offrande, et non seulement une habitude.
Je leve les mains et le c\u0153ur vers toi, au commencement de la nuit.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Book of Common Prayer Evening Prayer opening sentence (Ps 141:2); Central Bible Study \u2014 30 Prayer for Night With Scriptures (Ps 141:2 as evening offering)",url:"https://www.churchofengland.org/liturgy/book-of-common-prayer/order-evening-prayer"},theme:"Offering the close of the day to God like evening incense"},{id:"pm:shelter",title:{fr:"\xC0 l'ombre du Tout-Puissant",en:"Under the Shadow of the Almighty"},refs:["Psalm 91:1-5"],refsFr:["Psaumes 91:1-5"],text:{en:`Most High, I dwell in your secret place and rest under the shadow of the Almighty.
You are my refuge and my fortress; in you I trust.
Cover me with your wings, and let your truth be my shield.
I will not be afraid for the terror by night, nor for what walks in darkness.
Keep my household in your shelter until morning.
In Jesus' name, amen.`,fr:`Tr\xE8s-Haut, je demeure sous ton abri et je repose \xE0 l'ombre du Tout-Puissant.
Tu es mon refuge et ma forteresse; en toi je me confie.
Couvre-moi de tes ailes, et que ta fid\xE9lit\xE9 soit mon bouclier.
Je ne craindrai ni les terreurs de la nuit, ni ce qui marche dans les t\xE9n\xE8bres.
Garde ma maison sous ton abri jusqu'au matin.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk \u2014 5 Nighttime Prayers for Protection (Ps 91); bibleguidence.com and prayersfor.com night-verse lists; Christianity.com night prayers citing Ps 91",url:"https://www.crosswalk.com/faith/prayer/night-prayers-for-protection.html"},theme:"Night protection under God's shelter, without fear of the dark"},{id:"pm:watches",title:{fr:"Pendant les veilles de la nuit",en:"In the Night Watches"},refs:["Psalm 63:6-7"],refsFr:["Psaumes 63:7-8"],text:{en:`When I remember you upon my bed, and meditate on you in the night watches, be my help.
If I wake in the dark, turn my thoughts to you, not to worry.
You have been my help; therefore in the shadow of your wings I will rejoice.
Stay with me through every watch of the night.
Let my last thoughts and my first thoughts be of you.
In Jesus' name, amen.`,fr:`Lorsque je pense \xE0 toi sur ma couche et que je medite sur toi pendant les veilles de la nuit, sois mon secours.
Si je m'\xE9veille dans le noir, tourne mes pens\xE9es vers toi, non vers l'inqui\xE9tude.
Tu es mon secours; aussi je suis dans l'all\xE9gresse \xE0 l'ombre de tes ailes.
Reste avec moi \xE0 chaque veille de la nuit.
Que mes dernieres pens\xE9es et mes premieres pens\xE9es soient \xE0 toi.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Central Bible Study \u2014 night prayers on Ps 63:6; also common Compline / night-watch use of this psalm in church devotionals",url:"https://centralbiblestudy.com/prayer-for-night/"},theme:"Remembering God on the bed and through the night watches"},{id:"pm:keeper",title:{fr:"Celui qui me garde ne dort pas",en:"The One Who Keeps Me Does Not Sleep"},refs:["Psalm 121:3-4"],refsFr:["Psaumes 121:3-4"],text:{en:`Lord, you will not suffer my foot to be moved; you who keep me will not slumber.
Behold, you who keep your people neither slumber nor sleep.
I can close my eyes because you keep yours open.
Watch over my going out and my coming in, and over all I cannot see tonight.
I rest because you do not rest from caring for me.
In Jesus' name, amen.`,fr:`Seigneur, tu ne permettras point que mon pied chancelle; toi qui me gardes, tu ne sommeilleras point.
Voici, tu ne sommeilles ni ne dors, toi qui gardes les tiens.
Je peux fermer les yeux parce que les tiens restent ouverts.
Veille sur mon d\xE9part et mon arriv\xE9e, et sur tout ce que je ne vois pas cette nuit.
Je me repose parce que tu ne cesses pas de prendre soin de moi.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk Your Nightly Prayer \u2014 God's Protection Through the Night (Ps 121); bibleguidence.com and prayersfor.com lists of Ps 121:3-4 for nights of fear",url:"https://www.crosswalk.com/devotionals/your-nightly-prayer/gods-protection-through-the-night.html"},theme:"Trusting the God who watches and never sleeps"},{id:"pm:nightlight",title:{fr:"La nuit brille comme le jour",en:"The Night Shines as the Day"},refs:["Psalm 139:11-12"],refsFr:["Psaumes 139:11-12"],text:{en:`If I say, surely the darkness shall cover me, even the night shall be light about me.
The darkness hides not from you; the night shines as the day, and darkness and light are both alike to you.
Nothing in this night is hidden from your sight.
Where I feel covered by gloom, be light around me.
I lie down known, seen, and held by you.
In Jesus' name, amen.`,fr:`Si je dis : au moins les t\xE9n\xE8bres me couvriront, la nuit devient lumi\xE8re autour de moi.
M\xEAme les t\xE9n\xE8bres ne sont pas obscures pour toi; la nuit brille comme le jour, et les t\xE9n\xE8bres comme la lumi\xE8re.
Rien dans cette nuit n'est cach\xE9 \xE0 tes yeux.
L\xE0 o\xF9 je me sens couvert de tristesse, sois lumi\xE8re autour de moi.
Je me couche connu, vu et tenu par toi.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"BCP Evening Prayer opening sentences (Ps 139); Central Bible Study night prayers on Ps 139:11-12; bcponline.org Evening Prayer Rite I",url:"https://www.bcponline.org/DailyOffice/ep1.html"},theme:"God sees clearly in the dark; night is not dark to him"},{id:"pm:rest",title:{fr:"Venez \xE0 moi, et je vous donnerai du repos",en:"Come to Me, and I Will Give You Rest"},refs:["Matthew 11:28"],refsFr:["Matthieu 11:28"],text:{en:`Jesus, you said, Come unto me, all ye that labour and are heavy laden, and I will give you rest.
I bring you the weariness of this day, in my body and in my heart.
I do not have to finish carrying what is too heavy for me.
Give me rest for my soul, and quiet sleep for my body.
I come to you as I am, and I receive your rest.
In your name, amen.`,fr:`J\xE9sus, tu as dit : Venez \xE0 moi, vous tous qui \xEAtes fatigu\xE9s et charg\xE9s, et je vous donnerai du repos.
Je t'apporte la fatigue de ce jour, dans mon corps et dans mon c\u0153ur.
Je n'ai pas \xE0 continuer de porter ce qui est trop lourd pour moi.
Donne le repos \xE0 mon \xE2me, et un sommeil calme \xE0 mon corps.
Je viens \xE0 toi tel que je suis, et je re\xE7ois ton repos.
En ton nom, amen.`},inspiredBy:{platform:"web",source:"Crosswalk, prayersfor.com, stillbible.app, and videobible.com night-verse pages featuring Matt 11:28 as a bedtime invitation to rest",url:"https://www.prayersfor.com/article/bible-verses-for-sleep"},theme:"Bringing the day's weariness to Jesus for rest"},{id:"pm:cares",title:{fr:"Je me d\xE9charge de mes soucis",en:"I Cast My Cares on You"},refs:["1 Peter 5:7","Philippians 4:7"],refsFr:["1 Pierre 5:7","Philippiens 4:7"],text:{en:`Lord, I cast all my care upon you, for you care for me.
I name before you the worries I am tempted to take to bed.
I do not have to solve them before I sleep.
Let the peace of God, which passes all understanding, keep my heart and mind through Christ Jesus.
I leave my cares in your hands until morning.
In Jesus' name, amen.`,fr:`Seigneur, je me d\xE9charge sur toi de tous mes soucis, car toi-m\xEAme tu prends soin de moi.
Je te nomme les inqui\xE9tudes que je serais tent\xE9 d'emporter au lit.
Je n'ai pas \xE0 les r\xE9soudre avant de dormir.
Que la paix de Dieu, qui surpasse toute intelligence, garde mon c\u0153ur et mes pens\xE9es en J\xE9sus-Christ.
Je laisse mes soucis entre tes mains jusqu'au matin.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk nightly prayers citing 1 Pet 5:7 with Ps 4:8; Video Bible and prayersfor.com lists pairing 1 Pet 5:7 and Phil 4:6-7 for anxious nights",url:"https://www.videobible.com/bible-verses-for-night-prayer"},theme:"Handing nighttime worries to the God who cares"},{id:"pm:mercies",title:{fr:"Tes bont\xE9s m'attendront au matin",en:"Your Mercies Will Meet Me in the Morning"},refs:["Lamentations 3:22-23"],refsFr:["Lamentations 3:22-23"],text:{en:`It is of your mercies that we are not consumed, because your compassions fail not.
They are new every morning: great is your faithfulness.
I close this day under the mercy that carried me, and I trust the mercy that will be new at dawn.
Whatever was unfinished or painful, I leave it for tomorrow's compassion.
Let me sleep as one who will wake to your faithfulness.
In Jesus' name, amen.`,fr:`Tes bont\xE9s, Seigneur, ne sont pas \xE9puis\xE9es, et tes compassions ne sont pas \xE0 leur terme.
Elles se renouvellent chaque matin : oh ! que ta fid\xE9lit\xE9 est grande.
Je ferme ce jour sous la mis\xE9ricorde qui m'a port\xE9, et je fais confiance \xE0 celle qui sera nouvelle \xE0 l'aube.
Quoi qu'il soit reste inachev\xE9 ou douloureux, je le laisse \xE0 la compassion de demain.
Que je dorme comme celui qui se r\xE9veillera dans ta fid\xE9lit\xE9.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk night prayer for peaceful sleep citing Lam 3:22-23 (mercies new in the morning); also morning-verse pages already used in the morning set, reused here as evening hope",url:"https://www.crosswalk.com/faith/prayer/night-prayers-for-protection.html"},theme:"Ending the day in mercy and trusting tomorrow's new compassion"},{id:"pm:counsel",title:{fr:"Tu me conseilles m\xEAme la nuit",en:"You Counsel Me in the Night"},refs:["Psalm 16:7-8"],refsFr:["Psaumes 16:7-8"],text:{en:`I will bless the Lord, who has given me counsel; my heart also instructs me in the night seasons.
I have set you always before me; because you are at my right hand, I shall not be moved.
If thoughts rise in the dark, let them be guided by you, not by fear.
Stay at my right hand while I sleep, and I will not be shaken.
I bless you for counsel already given, and for wisdom still to come.
In Jesus' name, amen.`,fr:`Je b\xE9nis l'\xC9ternel, mon conseiller; la nuit m\xEAme mon c\u0153ur m'exhorte.
J'ai constamment l'\xC9ternel sous mes yeux; quand il est \xE0 ma droite, je ne chancelle pas.
Si des pens\xE9es s'\xE9l\xE8vent dans le noir, qu'elles soient guid\xE9es par toi, non par la peur.
Reste \xE0 ma droite pendant que je dors, et je ne serai pas \xE9branl\xE9.
Je te b\xE9nis pour le conseil d\xE9j\xE0 re\xE7u, et pour la sagesse encore \xE0 venir.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"BCP Evening Prayer opening sentences (Ps 16:7-8); Video Bible night-prayer verse list including Ps 16:8",url:"https://www.bcponline.org/DailyOffice/ep1.html"},theme:"Receiving God's counsel and presence in the night seasons"},{id:"pm:song",title:{fr:"La nuit, je chante tes louanges",en:"In the Night His Song Is with Me"},refs:["Psalm 42:8"],refsFr:["Psaumes 42:9"],text:{en:`Lord, you command your lovingkindness in the daytime, and in the night your song shall be with me, and my prayer unto the God of my life.
Even if this day was heavy, let a song of your love stay with me in the dark.
You are the God of my life, by day and by night.
Put your praise on my lips if worry tries to take their place.
I pray to you now, and I rest with your song nearby.
In Jesus' name, amen.`,fr:`Le jour, tu m'accordes ta gr\xE2ce; la nuit, je chante tes louanges, et j'adresse une pri\xE8re au Dieu de ma vie.
M\xEAme si ce jour a \xE9t\xE9 lourd, qu'un cantique de ton amour reste avec moi dans le noir.
Tu es le Dieu de ma vie, le jour et la nuit.
Mets ta louange sur mes l\xE8vres si l'inqui\xE9tude veut prendre leur place.
Je te prie maintenant, et je me repose avec ton chant tout pr\xE8s.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Theme of night praise in the Psalms; Crosswalk Slumber and Song nightly prayer (Ps 4:8 with God who sings over his people); verse sense checked in KJV / LSG (FR numbering Psaumes 42:9)",url:"https://www.crosswalk.com/devotionals/your-nightly-prayer/slumber-and-song.html"},theme:"God's song and prayer in the night after a hard day"},{id:"pm:sweet",title:{fr:"Un sommeil doux",en:"Sweet Sleep"},refs:["Proverbs 3:24"],refsFr:["Proverbes 3:24"],text:{en:`When I lie down, I shall not be afraid; I shall lie down, and my sleep shall be sweet.
I trust you with this night, not my own understanding.
Drive away fear that sits at the edge of the bed.
Give me sleep that is truly rest, a gift from your hand.
I lie down without fear, because you are here.
In Jesus' name, amen.`,fr:`Si je me couche, je serai sans crainte; et quand je serai couch\xE9, mon sommeil sera doux.
Je te confie cette nuit, et non \xE0 ma propre sagesse.
Chasse la peur qui s'assoit au bord du lit.
Donne-moi un sommeil qui soit un vrai repos, un don de ta main.
Je me couche sans crainte, parce que tu es l\xE0.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"bibleguidence.com, prayersfor.com, stillbible.app, and Video Bible night-verse collections highlighting Prov 3:24 for fearless, sweet sleep",url:"https://bibleguidence.com/powerful-night-prayers-bible-verses/"},theme:"Lying down without fear and receiving sweet sleep"},{id:"pm:abide",title:{fr:"Reste avec nous, car le soir approche",en:"Abide with Us, for It Is toward Evening"},refs:["Luke 24:29"],refsFr:["Luc 24:29"],text:{en:`Lord Jesus, I constrain you with the prayer of the disciples: abide with us, for it is toward evening, and the day is far spent.
Stay with me as the light fades.
Be my companion at this table, in this house, and in the hours of sleep.
Kindle my heart again if it has grown cold today.
Enter and remain with me through the night.
In your name, amen.`,fr:`Seigneur J\xE9sus, je te prie avec les disciples : reste avec nous, car le soir approche, le jour est sur son d\xE9clin.
Reste aupr\xE8s de moi tandis que la lumi\xE8re s'en va.
Sois mon compagnon \xE0 cette table, dans cette maison, et dans les heures de sommeil.
Rallume mon c\u0153ur s'il s'est refroidi aujourd'hui.
Entre et demeure avec moi pendant la nuit.
En ton nom, amen.`},inspiredBy:{platform:"web",source:"BCP / later Prayer Book Collect for the Presence of Christ based on Luke 24:29 (stay with us, for evening is at hand); bcponline.org Evening Prayer. App text is original, not a copy of later copyrighted collect wording.",url:"https://www.bcponline.org/DailyOffice/ep1.html"},theme:"Asking Jesus to stay as evening comes, as at Emmaus"},{id:"pm:confess",title:{fr:"Pardonne et purifie avant la nuit",en:"Forgive and Cleanse Me before I Sleep"},refs:["1 John 1:9"],refsFr:["1 Jean 1:9"],text:{en:`If we confess our sins, you are faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.
I confess what I have done wrong today, in word, thought, or deed, and what I have left undone.
Forgive me, and help me forgive anyone who has hurt me.
Do not let shame keep me awake; wash me and give me a clean rest.
I close the day in your faithfulness and justice.
In Jesus' name, amen.`,fr:`Si nous confessons nos p\xE9ch\xE9s, tu es fid\xE8le et juste pour nous les pardonner, et pour nous purifier de toute iniquit\xE9.
Je confesse ce que j'ai mal fait aujourd'hui, en paroles, en pens\xE9es ou en actes, et ce que j'ai laisse de c\xF4t\xE9.
Pardonne-moi, et aide-moi \xE0 pardonner \xE0 quiconque m'a bless\xE9.
Que la honte ne m'emp\xEAche pas de dormir; purifie-moi et donne-moi un repos net.
Je ferme le jour dans ta fid\xE9lit\xE9 et ta justice.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com \u2014 31 Powerful Night Prayers includes a confession/forgiveness night prayer; classic examination of the day before sleep in Christian practice",url:"https://www.christianity.com/wiki/prayer/why-pray-at-night-prayers-for-evening-and-bedtime.html"},theme:"Evening confession, forgiveness, and a clean conscience before sleep"},{id:"pm:lighten",title:{fr:"\xC9claire nos t\xE9n\xE8bres",en:"Lighten Our Darkness"},refs:["Book of Common Prayer 1662, Third Collect at Evening Prayer"],refsFr:["Livre de la pri\xE8re commune 1662, troisi\xE8me collecte du soir"],text:{en:"Lighten our darkness, we beseech thee, O Lord; and by thy great mercy defend us from all perils and dangers of this night; for the love of thy only Son, our Saviour, Jesus Christ. Amen.",fr:"\xC9claire nos t\xE9n\xE8bres, nous te prions, \xF4 Seigneur; et par ta grande mis\xE9ricorde, d\xE9fends-nous de tous les p\xE9rils et dangers de cette nuit; pour l'amour de ton Fils unique, notre Sauveur J\xE9sus-Christ. Amen."},inspiredBy:{platform:"web",source:"Public-domain 1662 Book of Common Prayer, The Order for Evening Prayer, Third Collect for Aid against all Perils, as printed by the Church of England. English is quoted verbatim. French is a faithful original translation, not a modern copyrighted liturgical text.",url:"https://www.churchofengland.org/liturgy/book-of-common-prayer/order-evening-prayer"},theme:"Classic evening collect asking God to lighten the darkness and defend the night"}]});var Bf,_f=Xe(()=>{Bf=[{id:"ev:anxious-peace",title:{fr:"Ta paix garde mon c\u0153ur",en:"Your Peace Guards My Heart"},refs:["Philippians 4:6-7"],refsFr:["Philippiens 4:6-7"],text:{en:`Lord, I will be careful for nothing; but in everything, by prayer and supplication with thanksgiving, I make my requests known to you.
I bring you what is making me anxious, with thanks for your care already shown.
Let the peace of God, which passes all understanding, keep my heart and mind through Christ Jesus.
Guard my thoughts when they start to race.
I choose prayer instead of worry, and I rest in your peace.
In Jesus' name, amen.`,fr:`Seigneur, je ne m'inqui\xE8te de rien; mais en toute chose je te fais conna\xEEtre mes besoins par des pri\xE8res et des supplications, avec des actions de gr\xE2ces.
Je t'apporte ce qui m'angoisse, en te remerciant du soin que tu as d\xE9j\xE0 pris de moi.
Que la paix de Dieu, qui surpasse toute intelligence, garde mon c\u0153ur et mes pens\xE9es en J\xE9sus-Christ.
Garde mes pens\xE9es quand elles commencent \xE0 s'emballer.
Je choisis la pri\xE8re plut\xF4t que l'inqui\xE9tude, et je me repose dans ta paix.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web + YouTube + TikTok (titles/snippets only)",source:"Crosswalk \u2014 40 Prayers for Peace; YouTube meditations on Bible verses for anxiety; TikTok public listings quoting Phil 4:6-7 (e.g. @craiggroeschel). Full TikTok/IG videos often fail to play; wording here is original.",url:"https://www.crosswalk.com/faith/prayer/a-prayer-for-inner-peace.html"},theme:"Peace / anxiety"},{id:"ev:cast-burden",title:{fr:"Je remets mon sort \xE0 l'\xC9ternel",en:"I Cast My Burden on the Lord"},refs:["1 Peter 5:7","Psalm 55:22"],refsFr:["1 Pierre 5:7","Psaumes 55:23"],text:{en:`I cast all my care upon you, for you care for me.
I cast my burden upon you, Lord, and you shall sustain me; you will not suffer the righteous to be moved.
This weight is too heavy for me, but not for you.
Take what I cannot carry, and hold me steady.
I trust you with this load today.
In Jesus' name, amen.`,fr:`Je me d\xE9charge sur toi de tous mes soucis, car toi-m\xEAme tu prends soin de moi.
Je remets mon sort \xE0 l'\xC9ternel, et tu me soutiendras; tu ne laisseras jamais chanceler le juste.
Ce poids est trop lourd pour moi, mais pas pour toi.
Prends ce que je ne peux pas porter, et tiens-moi ferme.
Je te confie cette charge aujourd'hui.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk and Christianity.com peace/anxiety prayer pages; prayersfor.com worry verses pairing 1 Pet 5:7 with casting our burden on the Lord",url:"https://www.christianity.com/wiki/prayer/"},theme:"Peace / anxiety"},{id:"ev:perfect-peace",title:{fr:"La paix, la paix, pour qui se confie",en:"Perfect Peace for the Steadfast Mind"},refs:["Isaiah 26:3"],refsFr:["\xC9sa\xEFe 26:3"],text:{en:`You will keep in perfect peace the one whose mind is stayed on you, because he trusts in you.
My thoughts pull toward fear; fix them on you.
Give me that double peace you promise to those who trust you.
When I cannot change the situation, steady my mind in yourself.
I trust you; keep me in your peace.
In Jesus' name, amen.`,fr:`\xC0 celui qui est ferme dans ses sentiments, tu assures la paix, la paix, parce qu'il se confie en toi.
Mes pens\xE9es tirent vers la peur; fixe-les sur toi.
Donne-moi cette paix, cette paix que tu promets \xE0 ceux qui se confient en toi.
Quand je ne peux pas changer la situation, affermis mon esprit en toi.
Je me confie en toi; garde-moi dans ta paix.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"prayersfor.com and other Christian verse lists for anxious minds citing Isa 26:3; Crosswalk prayers for inner peace",url:"https://www.prayersfor.com/article/bible-verses-for-sleep"},theme:"Peace / anxiety"},{id:"ev:christ-peace",title:{fr:"Je vous donne ma paix",en:"My Peace I Give to You"},refs:["John 14:27"],refsFr:["Jean 14:27"],text:{en:`Jesus, you said, Peace I leave with you, my peace I give unto you: not as the world gives, give I unto you.
Let not my heart be troubled, neither let it be afraid.
I receive the peace you give, not the fragile calm the world offers.
Speak peace to the places in me that are still alarmed.
I take your gift and I will not refuse it.
In your name, amen.`,fr:`J\xE9sus, tu as dit : Je vous laisse la paix, je vous donne ma paix. Je ne vous donne pas comme le monde donne.
Que mon c\u0153ur ne se trouble point, et ne s'alarme point.
Je re\xE7ois la paix que tu donnes, non le calme fragile que le monde offre.
Parle de paix aux endroits en moi qui sont encore alarm\xE9s.
Je prends ton don et je ne le refuse pas.
En ton nom, amen.`},inspiredBy:{platform:"web + YouTube (titles/snippets)",source:"Crosswalk nightly prayer on restless souls citing John 14:27; YouTube anxiety meditations quoting the same verse; prayersfor.com peace lists",url:"https://www.crosswalk.com/devotionals/your-nightly-prayer/sleep-for-the-souls-that-wont-settle.html"},theme:"Peace / anxiety"},{id:"ev:when-afraid",title:{fr:"Quand je suis dans la crainte",en:"When I Am Afraid, I Trust in You"},refs:["Psalm 56:3-4"],refsFr:["Psaumes 56:4"],text:{en:`What time I am afraid, I will trust in you.
In you I will praise your word; in you I have put my trust; I will not fear what flesh can do unto me.
Fear is present, but it will not be my master.
I choose trust in the very moment I am afraid.
Hold me until courage returns.
In Jesus' name, amen.`,fr:`Quand je suis dans la crainte, en toi je me confie.
En toi je loue ta parole; en toi je me confie; je ne craindrai pas ce que la chair peut me faire.
La peur est l\xE0, mais elle ne sera pas mon ma\xEEtre.
Je choisis la confiance au moment m\xEAme o\xF9 j'ai peur.
Tiens-moi jusqu'\xE0 ce que le courage revienne.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"prayersfor.com and bibleguidence.com protection/fear verse lists including Ps 56:3; short honest anytime prayer pattern",url:"https://www.prayersfor.com/article/bible-verses-for-sleep"},theme:"Peace / anxiety"},{id:"ev:heal-me",title:{fr:"Gu\xE9ris-moi, et je serai gu\xE9ri",en:"Heal Me, and I Shall Be Healed"},refs:["Jeremiah 17:14","Psalm 103:2-3"],refsFr:["J\xE9r\xE9mie 17:14","Psaumes 103:2-3"],text:{en:`Heal me, O Lord, and I shall be healed; save me, and I shall be saved: for you are my praise.
I bless you and will not forget your benefits: you forgive all iniquities and heal all diseases.
I bring you this body, this mind, and this wound, known to you.
Work according to your will, and give patience and hope while I wait.
You are my praise, in sickness and in health.
In Jesus' name, amen.`,fr:`Gu\xE9ris-moi, \xC9ternel, et je serai gu\xE9ri; sauve-moi, et je serai sauv\xE9, car tu es ma gloire.
Je te b\xE9nis et je n'oublie aucun de tes bienfaits: tu pardonnes toutes les iniquit\xE9s et tu gu\xE9ris toutes les maladies.
Je t'apporte ce corps, cet esprit et cette blessure, que tu connais.
Agis selon ta volont\xE9, et donne-moi patience et esp\xE9rance en attendant.
Tu es ma gloire, dans la maladie comme dans la sant\xE9.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com healing-prayer hub; common use of Jer 17:14 and Ps 103 in Christian healing prayer lists (original wording)",url:"https://www.christianity.com/wiki/prayer/"},theme:"Healing"},{id:"ev:prayer-faith",title:{fr:"La pri\xE8re de la foi",en:"The Prayer of Faith"},refs:["James 5:14-16"],refsFr:["Jacques 5:14-16"],text:{en:`Lord, you have said the prayer of faith shall save the sick, and you shall raise them up.
I pray for those who are ill, and I ask for elders, friends, and the church to stand with them.
Where there is sin to confess, bring forgiveness and healing together.
Teach us to pray for one another, for the fervent prayer of a righteous person avails much.
Raise up the weak according to your mercy.
In Jesus' name, amen.`,fr:`Seigneur, tu as dit que la pri\xE8re de la foi sauver\xE0 le malade, et que tu le rel\xE8veras.
Je prie pour ceux qui sont malades, et je demande que les anciens, les amis et l'\xC9glise se tiennent avec eux.
L\xE0 o\xF9 il y a un p\xE9ch\xE9 \xE0 confesser, unis le pardon et la gu\xE9rison.
Apprends-nous \xE0 prier les uns pour les autres, car la pri\xE8re fervente du juste a une grande efficace.
Rel\xE8ve les faibles selon ta mis\xE9ricorde.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com prayers for healing; James 5 as the classic church-prayer-for-the-sick passage in ministry articles",url:"https://www.christianity.com/wiki/prayer/"},theme:"Healing"},{id:"ev:stripes",title:{fr:"Par ses meurtrissures nous sommes gu\xE9ris",en:"By His Stripes We Are Healed"},refs:["Isaiah 53:5"],refsFr:["\xC9sa\xEFe 53:5"],text:{en:`He was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him, and with his stripes we are healed.
Jesus, I look to the cross for mercy, peace, and healing.
Apply to me the peace you purchased, and the healing you have promised.
Where I am broken, let your wounds be my hope.
I trust the work you have already done for me.
In your name, amen.`,fr:`Il \xE9tait bless\xE9 pour nos p\xE9ch\xE9s, bris\xE9 pour nos iniquit\xE9s; le ch\xE2timent qui nous donne la paix est tomb\xE9 sur lui, et c'est par ses meurtrissures que nous sommes gu\xE9ris.
J\xE9sus, je r\xE9garde \xE0 la croix pour la mis\xE9ricorde, la paix et la gu\xE9rison.
Applique-moi la paix que tu as acquise, et la gu\xE9rison que tu as promise.
L\xE0 o\xF9 je suis bris\xE9, que tes blessures soient mon esp\xE9rance.
Je fais confiance \xE0 l'\u0153uvre que tu as d\xE9j\xE0 accomplie pour moi.
En ton nom, amen.`},inspiredBy:{platform:"web",source:"Common Christian healing-prayer use of Isa 53:5 on ministry sites (Christianity.com / Crosswalk healing and atonement articles). Original prayer text.",url:"https://www.christianity.com/wiki/prayer/"},theme:"Healing"},{id:"ev:my-house",title:{fr:"Moi et ma maison, nous servirons l'\xC9ternel",en:"As for Me and My House"},refs:["Joshua 24:15"],refsFr:["Josu\xE9 24:15"],text:{en:`As for me and my house, we will serve the Lord.
I set this home under your name today.
Guide our words, our table, our work, and our rest, that this household may honor you.
Where we have served other masters -- fear, anger, or busyness -- turn us back to you.
Be the Lord of this house, and help us keep this choice.
In Jesus' name, amen.`,fr:`Moi et ma maison, nous servirons l'\xC9ternel.
Je place aujourd'hui cette maison sous ton nom.
Guide nos paroles, notre table, notre travail et notre repos, afin que ce foyer t'honore.
L\xE0 o\xF9 nous avons servi d'autres ma\xEEtres -- la peur, la col\xE8re ou la pr\xE9cipitation -- ram\xE8ne-nous vers toi.
Sois le Seigneur de cette maison, et aide-nous \xE0 tenir ce choix.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web + Instagram (titles/snippets)",source:"Crosswalk \u2014 15 Prayers for Your Family; Instagram public posts/reels praying for family (e.g. @n2prayer, @pray). Full IG feeds often login-walled; only search snippets used. Original text.",url:"https://www.crosswalk.com/faith/prayer/10-ways-to-pray-for-and-with-your-family-to-strengthen-your-bond-and-unity.html"},theme:"Family"},{id:"ev:children",title:{fr:"Pour les enfants que tu confies",en:"For the Children You Entrust to Us"},refs:["Psalm 127:3","Proverbs 22:6"],refsFr:["Psaumes 127:3","Proverbes 22:6"],text:{en:`Lo, children are an heritage of the Lord, and the fruit of the womb is his reward.
Train up a child in the way he should go: and when he is old, he will not depart from it.
I thank you for the children in my life; they belong first to you.
Give me wisdom, patience, and a faithful example.
Guard their steps, and lead them in your way all their days.
In Jesus' name, amen.`,fr:`Voici, des fils sont un h\xE9ritage de l'\xC9ternel, le fruit des entrailles est une r\xE9compense.
Instruis l'enfant selon la voie qu'il doit suivre; et quand il sera vieux, il ne s'en d\xE9tournera pas.
Je te rends gr\xE2ce pour les enfants de ma vie; ils t'appartiennent d'abord.
Donne-moi sagesse, patience et un exemple fid\xE8le.
Garde leurs pas, et conduis-les dans tes voies tous leurs jours.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web + Instagram (snippets)",source:"Crosswalk family-prayer articles; Instagram posts of Bible verses for overwhelmed parents (e.g. @crazycoolfamily citing Phil 4:6-7). Prayer here is original and grounded in Ps 127 / Prov 22.",url:"https://www.crosswalk.com/faith/prayer/10-ways-to-pray-for-and-with-your-family-to-strengthen-your-bond-and-unity.html"},theme:"Family"},{id:"ev:love-one-another",title:{fr:"Une charit\xE9 qui endure",en:"A Love That Endures"},refs:["1 Corinthians 13:4-7"],refsFr:["1 Corinthiens 13:4-7"],text:{en:`Lord, teach me this love: it suffers long and is kind; it envies not, vaunts not itself, is not puffed up.
It does not behave unseemly, seeks not its own, is not easily provoked, thinks no evil.
It rejoices not in iniquity, but rejoices in the truth; it bears, believes, hopes, and endures all things.
Form this love in my marriage, my family, and my friendships.
Where I have been impatient or proud, make me kind again.
In Jesus' name, amen.`,fr:`Seigneur, enseigne-moi cette charit\xE9: elle est patiente, elle est pleine de bont\xE9; elle n'est point envieuse, elle ne se vante point, elle ne s'enfle point d'orgueil.
Elle ne fait rien de malhonn\xEAte, elle ne cherche point son int\xE9r\xEAt, elle ne s'irrite point, elle ne soup\xE7onne point le mal.
Elle ne se r\xE9jouit point de l'injustice, mais de la v\xE9rit\xE9; elle excuse tout, croit tout, esp\xE8re tout, supporte tout.
Forme cet amour dans mon couple, ma famille et mes amiti\xE9s.
L\xE0 o\xF9 j'ai \xE9t\xE9 impatient ou orgueilleux, rends-moi de nouveau bon.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk family and marriage prayer features that return to 1 Cor 13 as the pattern of love (original wording, not copied prayers)",url:"https://www.crosswalk.com/faith/prayer/10-ways-to-pray-for-and-with-your-family-to-strengthen-your-bond-and-unity.html"},theme:"Family"},{id:"ev:work-heartily",title:{fr:"Affermis l'ouvrage de mes mains",en:"Establish the Work of My Hands"},refs:["Colossians 3:23","Psalm 90:17"],refsFr:["Colossiens 3:23","Psaumes 90:17"],text:{en:`Whatever I do, help me do it heartily, as to you and not unto people.
Let the beauty of the Lord our God be upon us; establish the work of our hands, yes, establish it.
Give me honesty, skill, and a willing heart in today's tasks.
Keep me from working only for praise, and from despair when the work is hard.
May this labor honor you.
In Jesus' name, amen.`,fr:`Tout ce que je fais, aide-moi \xE0 le faire de bon c\u0153ur, comme pour toi et non pour des hommes.
Que la gr\xE2ce de l'\xC9ternel, notre Dieu, soit sur nous; affermis l'ouvrage de nos mains, oui, affermis-le.
Donne-moi honn\xEAtet\xE9, comp\xE9tence et un c\u0153ur dispos\xE9 dans les t\xE2ches d'aujourd'hui.
Garde-moi de travailler seulement pour les louanges, et du d\xE9couragement quand le travail est dur.
Que cette peine t'honore.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk \u2014 Prayers For Work (job, workplace, establish the work of our hands); Christianity.com work-and-calling prayer pages",url:"https://www.crosswalk.com/faith/prayer/7-prayers-for-work-from-job-searching-to-climbing-the-career-ladder.html"},theme:"Work"},{id:"ev:commit-work",title:{fr:"Je te recommande mes \u0153uvres",en:"I Commit My Work to You"},refs:["Proverbs 16:3"],refsFr:["Proverbes 16:3"],text:{en:`I commit my works unto you, Lord; establish my thoughts.
I place this job, this project, and this decision in your hands.
Order my plans where they are wise, and correct them where they are not.
Give me diligence without anxiety, and patience when doors are slow to open.
I trust you with the outcome.
In Jesus' name, amen.`,fr:`Je recommande \xE0 l'\xC9ternel mes \u0153uvres; \xE9tablis mes pens\xE9es.
Je place ce travail, ce projet et cette d\xE9cision entre tes mains.
Dirige mes plans s'ils sont sages, et corrige-les s'ils ne le sont pas.
Donne-moi de la diligence sans anxi\xE9t\xE9, et de la patience quand les portes s'ouvrent lentement.
Je te fais confiance pour le r\xE9sultat.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web + YouTube (titles)",source:"Crosswalk prayers for work and job-seeking; YouTube prayer-point videos citing Prov 16:3 for work and plans. Original text.",url:"https://www.crosswalk.com/faith/prayer/7-prayers-for-work-from-job-searching-to-climbing-the-career-ladder.html"},theme:"Work"},{id:"ev:trust-paths",title:{fr:"Aplanis mes sentiers",en:"Direct My Paths"},refs:["Proverbs 3:5-6"],refsFr:["Proverbes 3:5-6"],text:{en:`I trust in you with all my heart, and I lean not on my own understanding.
In all my ways I acknowledge you; direct my paths.
Where I am sure of myself, make me humble; where I am lost, make the way plain.
I want your direction more than my own plan.
Lead me today, step by step.
In Jesus' name, amen.`,fr:`Je me confie en toi de tout mon c\u0153ur, et je ne m'appuie pas sur ma sagesse.
Je te reconnais dans toutes mes voies; aplanis mes sentiers.
L\xE0 o\xF9 je suis s\xFBr de moi, rends-moi humble; l\xE0 o\xF9 je suis perdu, rends le chemin clair.
Je veux ta direction plus que mon propre plan.
Conduis-moi aujourd'hui, pas \xE0 pas.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com prayers for protection and guidance; Crosswalk guidance/decision prayers commonly built on Prov 3:5-6",url:"https://www.christianity.com/wiki/prayer/"},theme:"Guidance"},{id:"ev:ask-wisdom",title:{fr:"Je te demande la sagesse",en:"I Ask You for Wisdom"},refs:["James 1:5"],refsFr:["Jacques 1:5"],text:{en:`If I lack wisdom, I ask it of you: you give to all liberally, and do not upbraid, and it shall be given.
I need wisdom for this choice, this conversation, and this next step.
You will not shame me for asking.
Give generously, and help me receive and obey what you give.
I ask in faith, not in doubt of your goodness.
In Jesus' name, amen.`,fr:`Si je manque de sagesse, je te la demande: tu donnes \xE0 tous simplement et sans reproche, et elle me sera donn\xE9e.
J'ai besoin de sagesse pour ce choix, cette conversation et cette prochaine \xE9tape.
Tu ne me feras pas honte d'avoir demand\xE9.
Donne g\xE9n\xE9reusement, et aide-moi \xE0 recevoir et \xE0 ob\xE9ir \xE0 ce que tu donnes.
Je demande avec foi, sans douter de ta bont\xE9.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com / Crosswalk guidance and decision-prayer articles using Jas 1:5",url:"https://www.christianity.com/wiki/prayer/"},theme:"Guidance"},{id:"ev:show-ways",title:{fr:"Fais-moi conna\xEEtre tes voies",en:"Show Me Your Ways"},refs:["Psalm 25:4-5"],refsFr:["Psaumes 25:4-5"],text:{en:`Show me your ways, O Lord; teach me your paths.
Lead me in your truth, and teach me: for you are the God of my salvation; on you I wait all the day.
I do not want a shortcut around your will.
Teach me patiently, and keep me from rushing ahead.
I wait on you today.
In Jesus' name, amen.`,fr:`\xC9ternel, fais-moi conna\xEEtre tes voies, enseigne-moi tes sentiers.
Conduis-moi dans ta v\xE9rit\xE9, et instruis-moi, car tu es le Dieu de mon salut; tu es toujours mon esp\xE9rance.
Je ne veux pas d'un raccourci hors de ta volont\xE9.
Enseigne-moi avec patience, et emp\xEAche-moi de courir en avant.
J'esp\xE8re en toi aujourd'hui.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Classic psalm-prayers for guidance on ministry sites and in guidance verse lists (Crosswalk, Guideposts-style devotionals)",url:"https://www.christianity.com/wiki/prayer/"},theme:"Guidance"},{id:"ev:clean-heart",title:{fr:"Cr\xE9e en moi un c\u0153ur pur",en:"Create in Me a Clean Heart"},refs:["Psalm 51:10-12"],refsFr:["Psaumes 51:12-14"],text:{en:`Create in me a clean heart, O God, and renew a right spirit within me.
Cast me not away from your presence, and take not your Holy Spirit from me.
Restore unto me the joy of your salvation, and uphold me with your free spirit.
I confess my sin and do not hide it from you.
Wash me, and give me back the joy of being near you.
In Jesus' name, amen.`,fr:`\xD4 Dieu, cr\xE9e en moi un c\u0153ur pur, renouvelle en moi un esprit bien dispos\xE9.
Ne me rejette pas loin de ta face, ne me retire pas ton Esprit saint.
Rends-moi la joie de ton salut, et qu'un esprit de bonne volont\xE9 me soutienne.
Je confesse mon p\xE9ch\xE9 et je ne te le cache pas.
Purifie-moi, et rends-moi la joie d'\xEAtre pr\xE8s de toi.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com night/confession prayers; historic Christian use of Psalm 51 as a prayer of repentance (KJV 51:10-12 = LSG 51:12-14 because of the title verses)",url:"https://www.christianity.com/wiki/prayer/why-pray-at-night-prayers-for-evening-and-bedtime.html"},theme:"Forgiveness"},{id:"ev:forgive-others",title:{fr:"Comme tu nous as pardonn\xE9",en:"As You Have Forgiven Us"},refs:["Matthew 6:12-14","Ephesians 4:32"],refsFr:["Matthieu 6:12-14","\xC9ph\xE9siens 4:32"],text:{en:`Forgive us our debts, as we forgive our debtors.
You have said that if we forgive others, our Father will also forgive us.
Make me kind, tenderhearted, and ready to forgive, even as you for Christ's sake have forgiven me.
I bring you the name and the hurt I still carry.
Loosen my grip, and set both of us free.
In Jesus' name, amen.`,fr:`Pardonne-nous nos offenses, comme nous aussi nous pardonnons \xE0 ceux qui nous ont offens\xE9s.
Tu as dit que si nous pardonnons aux hommes leurs offenses, notre P\xE8re nous pardonnera aussi.
Rends-moi bon, compatissant et pr\xEAt \xE0 pardonner, comme tu m'as pardonn\xE9 en Christ.
Je t'apporte le nom et la blessure que je porte encore.
Desserre ma main, et lib\xE8re-nous tous les deux.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Crosswalk / Christianity.com forgiveness prayer collections; the Lord's Prayer petition as a daily model",url:"https://www.christianity.com/wiki/prayer/"},theme:"Forgiveness"},{id:"ev:refuge",title:{fr:"Mon refuge et ma forteresse",en:"My Refuge and My Fortress"},refs:["Psalm 91:1-2","2 Thessalonians 3:3"],refsFr:["Psaumes 91:1-2","2 Thessaloniciens 3:3"],text:{en:`I dwell in the secret place of the Most High and abide under the shadow of the Almighty.
I say of you, Lord: you are my refuge and my fortress, my God; in you I trust.
You are faithful, and you will strengthen and protect from the evil one.
Cover my life, my home, and those I love.
I hide myself in you today.
In Jesus' name, amen.`,fr:`Je demeure sous l'abri du Tr\xE8s-Haut et je repose \xE0 l'ombre du Tout-Puissant.
Je dis \xE0 l'\xC9ternel: mon refuge et ma forteresse, mon Dieu en qui je me confie.
Tu es fid\xE8le, et tu fortifies et tu gardes du malin.
Couvre ma vie, ma maison et ceux que j'aime.
Je me cache en toi aujourd'hui.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web + YouTube (titles)",source:"Crosswalk nighttime protection prayers (Ps 91); YouTube public videos titled around Psalm 91 for home and family. Those videos are often long and copyrighted; this prayer is original and shorter, grounded in the psalm and 2 Thess 3:3.",url:"https://www.crosswalk.com/faith/prayer/night-prayers-for-protection.html"},theme:"Protection"},{id:"ev:shepherd",title:{fr:"L'\xC9ternel est mon berger",en:"The Lord Is My Shepherd"},refs:["Psalm 23:1-4"],refsFr:["Psaumes 23:1-4"],text:{en:`The Lord is my shepherd; I shall not want.
You make me to lie down in green pastures; you lead me beside the still waters; you restore my soul.
You lead me in paths of righteousness for your name's sake.
Though I walk through the valley of the shadow of death, I will fear no evil: for you are with me; your rod and your staff comfort me.
Shepherd me today, and I will lack nothing that you know I need.
In Jesus' name, amen.`,fr:`L'\xC9ternel est mon berger: je ne manquerai de rien.
Tu me fais reposer dans de verts p\xE2turages; tu me diriges pr\xE8s des eaux paisibles; tu restaures mon \xE2me.
Tu me conduis dans les sentiers de la justice, \xE0 cause de ton nom.
Quand je marche dans la vall\xE9e de l'ombre de la mort, je ne crains aucun mal, car tu es avec moi; ta houlette et ton b\xE2ton me rassurent.
Sois mon berger aujourd'hui, et je ne manquerai de rien de ce que tu sais n\xE9cessaire.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web + X",source:"prayersfor.com protection/comfort lists; X and ministry posts commonly grouping Ps 23 with night or anytime protection (e.g. @OriOkeItusile63 Psalms to Read Before Bedtime). Original prayer built from the psalm itself.",url:"https://www.prayersfor.com/article/bible-verses-for-sleep"},theme:"Protection"},{id:"ev:thanksgiving",title:{fr:"Rendre gr\xE2ces en toutes choses",en:"In Everything Give Thanks"},refs:["1 Thessalonians 5:18","Psalm 100:4","Psalm 103:1-2"],refsFr:["1 Thessaloniciens 5:18","Psaumes 100:4","Psaumes 103:1-2"],text:{en:`In everything I give thanks, for this is your will in Christ Jesus concerning me.
I enter your gates with thanksgiving and your courts with praise; I am thankful, and I bless your name.
Bless the Lord, O my soul, and forget not all his benefits.
I name before you gifts I could have overlooked today.
Give me a grateful heart, in plenty and in want.
In Jesus' name, amen.`,fr:`Je rends gr\xE2ces en toutes choses, car c'est ta volont\xE9 en J\xE9sus-Christ \xE0 mon \xE9gard.
J'entre dans tes portes avec des louanges, dans tes parvis avec des cantiques; je te c\xE9l\xE8bre et je b\xE9nis ton nom.
Mon \xE2me, b\xE9nis l'\xC9ternel, et n'oublie aucun de ses bienfaits.
Je te nomme des dons que j'aurais pu oublier aujourd'hui.
Donne-moi un c\u0153ur reconnaissant, dans l'abondance comme dans le manque.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com prayers of gratitude and thanksgiving; Crosswalk family gratitude prayers; classic use of Ps 100 and Ps 103",url:"https://www.christianity.com/wiki/prayer/"},theme:"Gratitude"},{id:"ev:strength-wait",title:{fr:"Ceux qui s'attendent \xE0 l'\xC9ternel",en:"Those Who Wait on the Lord"},refs:["Isaiah 40:31"],refsFr:["\xC9sa\xEFe 40:31"],text:{en:`They that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles; they shall run and not be weary; they shall walk and not faint.
I wait on you, not on my own leftover strength.
Renew me for the work and the waiting in front of me.
Teach me to walk when I cannot run, and to trust you either way.
Be the strength I do not have today.
In Jesus' name, amen.`,fr:`Ceux qui s'attendent \xE0 l'\xC9ternel renouvellent leur force; ils prennent leur essor comme les aigles; ils courent, et ne se lassent point; ils marchent, et ne se fatiguent point.
Je m'attends \xE0 toi, non \xE0 la force qui me reste.
Renouvelle-moi pour le travail et pour l'attent\xE9 qui sont devant moi.
Apprends-moi \xE0 marcher quand je ne peux pas courir, et \xE0 te faire confiance dans les deux cas.
Sois la force que je n'ai pas aujourd'hui.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com prayers for strength and courage; Crosswalk strength-in-hard-seasons articles citing Isa 40:31",url:"https://www.christianity.com/wiki/prayer/"},theme:"Strength"},{id:"ev:grace-enough",title:{fr:"Ma gr\xE2ce te suffit",en:"My Grace Is Sufficient"},refs:["2 Corinthians 12:9","Philippians 4:13"],refsFr:["2 Corinthiens 12:9","Philippiens 4:13"],text:{en:`You have said, My grace is sufficient for you: for my strength is made perfect in weakness.
I can do all things through Christ who strengthens me -- not all I wish, but all you ask.
I bring you my weakness without pretending I am strong.
Let your power rest on me, and your grace be enough for this day.
I rely on Christ, not on myself.
In Jesus' name, amen.`,fr:`Tu as dit: Ma gr\xE2ce te suffit, car ma puissance s'accomplit dans la faibless\xE9.
Je puis tout par celui qui me fortifie -- non tout ce que je souhaite, mais tout ce que tu demandes.
Je t'apporte ma faibless\xE9, sans faire semblant d'\xEAtre fort.
Que ta puissance repose sur moi, et que ta gr\xE2ce me suffise pour ce jour.
Je m'appuie sur Christ, non sur moi-m\xEAme.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com / Crosswalk prayers for strength; widely cited pairing of 2 Cor 12:9 and Phil 4:13 in Christian encouragement (original prayer)",url:"https://www.christianity.com/wiki/prayer/"},theme:"Strength"},{id:"ev:courage",title:{fr:"Fortifie-toi et prends courage",en:"Be Strong and of Good Courage"},refs:["Joshua 1:9"],refsFr:["Josu\xE9 1:9"],text:{en:`Have you not commanded me: be strong and of a good courage; be not afraid, neither be dismayed: for the Lord my God is with me wherever I go?
I step into what is ahead with that promise.
Drive out fear and dismay, and give me a steady courage.
Go with me into this meeting, this task, this unknown.
I am not alone.
In Jesus' name, amen.`,fr:`Ne m'as-tu pas donn\xE9 cet ordre: Fortifie-toi et prends courage? Ne t'effraie point et ne t'\xE9pouvante point, car l'\xC9ternel, ton Dieu, est avec toi dans tout ce que tu entreprendras.
J'avance vers ce qui vient avec cette promesse.
Chasse la peur et l'\xE9pouvante, et donne-moi un courage ferme.
Va avec moi dans cette rencontre, cette t\xE2che, cet inconnu.
Je ne suis pas seul.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com prayers for strength and courage; frequent use of Josh 1:9 in workplace, travel, and new-beginning prayer lists",url:"https://www.christianity.com/wiki/prayer/"},theme:"Strength"},{id:"ev:bless-meal",title:{fr:"B\xE9nir l'\xC9ternel pour ce repas",en:"A Blessing before the Meal"},refs:["Deuteronomy 8:10","Psalm 145:15-16","1 Timothy 4:4-5"],refsFr:["Deut\xE9ronome 8:10","Psaumes 145:15-16","1 Timoth\xE9e 4:4-5"],text:{en:`When we have eaten and are full, we will bless you for the good you have given.
The eyes of all wait upon you, and you give them their meat in due season; you open your hand and satisfy every living thing.
Every gift of yours is good, and is sanctified by your word and by prayer.
Thank you for this food, for those who prepared it, and for those who share it.
Bless this meal, and make us mindful of those who hunger.
In Jesus' name, amen.`,fr:`Lorsque nous mangerons et nous rassasierons, nous b\xE9nirons l'\xC9ternel pour le bien qu'il nous a donn\xE9.
Les yeux de tous esp\xE8rent en toi, et tu donnes la nourriture en son temps; tu ouvres ta main et tu rassasies \xE0 souhait tout ce qui a vie.
Tout ce que tu as cr\xE9e est bon, et tout est sanctifi\xE9 par ta parole et par la pri\xE8re.
Merci pour cette nourriture, pour ceux qui l'ont pr\xE9par\xE9e, et pour ceux qui la partagent.
B\xE9nis ce repas, et rends-nous attentifs \xE0 ceux qui ont faim.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com Prayer Before Meals; Crosswalk family mealtime prayers. Table-blessing custom is ancient; wording here is original and verse-based.",url:"https://www.christianity.com/wiki/prayer/"},theme:"Before a meal"},{id:"ev:travel",title:{fr:"Garde mon d\xE9part et mon arriv\xE9e",en:"Watch over My Going Out and Coming In"},refs:["Psalm 121:7-8","Proverbs 3:23"],refsFr:["Psaumes 121:7-8","Proverbes 3:23"],text:{en:`Lord, preserve me from all evil; preserve my soul.
Preserve my going out and my coming in, from this time forth and even for evermore.
Then I shall walk in my way safely, and my foot shall not stumble.
Watch over this journey, those who travel with me, and those I leave at home.
Bring us to our destination and home again in peace.
In Jesus' name, amen.`,fr:`\xC9ternel, garde-moi de tout mal, garde mon \xE2me.
Garde mon d\xE9part et mon arriv\xE9e, d\xE8s maintenant et \xE0 jamais.
Alors je marcherai avec assurance dans mon chemin, et mon pied ne heurtera pas.
Veille sur ce voyage, sur ceux qui partent avec moi, et sur ceux que je laisse \xE0 la maison.
Conduis-nous \xE0 destination et ram\xE8ne-nous en paix.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com \u2014 10 Prayers for Safe Travel and Bible Verses for Protection (Ps 121 often featured). Original prayer, not copied from that page's sample prayers.",url:"https://www.christianity.com/wiki/prayer/travel-prayers-for-protection-and-joy.html"},theme:"Before travel"},{id:"ev:for-others",title:{fr:"Des pri\xE8res pour tous les hommes",en:"Prayers for All People"},refs:["1 Timothy 2:1-2","James 5:16"],refsFr:["1 Timoth\xE9e 2:1-2","Jacques 5:16"],text:{en:`I offer supplications, prayers, intercessions, and giving of thanks for all people: for those in authority, and for those in need.
I pray that we may lead a quiet and peaceable life in all godliness and honesty.
I also pray for the people I now name before you.
Teach us to confess our faults and to pray one for another.
Let these prayers bear fruit according to your will.
In Jesus' name, amen.`,fr:`Je fais des pri\xE8res, des supplications, des requ\xEAtes, des actions de gr\xE2ces, pour tous les hommes: pour ceux qui sont \xE9lev\xE9s en dignit\xE9, et pour ceux qui sont dans le besoin.
Je prie afin que nous menions une vie paisible et tranquille, en toute pi\xE9t\xE9 et honn\xEAtet\xE9.
Je prie aussi pour les personnes que je te nomme maintenant.
Apprends-nous \xE0 confesser nos fautes et \xE0 prier les uns pour les autres.
Que ces pri\xE8res portent du fruit selon ta volont\xE9.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christianity.com intercession and pray-for-others pages; historic Christian practice of praying for leaders from 1 Tim 2",url:"https://www.christianity.com/wiki/prayer/"},theme:"For others"},{id:"ev:for-the-poor",title:{fr:"Pour les plus petits de tes fr\xE8res",en:"For the Least of These"},refs:["Proverbs 19:17","Matthew 25:40"],refsFr:["Proverbes 19:17","Matthieu 25:40"],text:{en:`He that has pity upon the poor lends unto the Lord, and you will repay what is given.
You have said, Inasmuch as you have done it unto one of the least of these my brethren, you have done it unto me.
Open my eyes to the hungry, the lonely, and the overlooked.
Give me a generous heart, and provide for those I cannot reach.
I pray for justice, daily bread, and dignity for the poor.
In Jesus' name, amen.`,fr:`Celui qui a piti\xE9 du pauvre pr\xEAte \xE0 l'\xC9ternel, et tu lui rendras selon son \u0153uvre.
Tu as dit: Toutes les fois que vous avez fait ces choses \xE0 l'un de ces plus petits de mes fr\xE8res, c'est \xE0 moi que vous les avez faites.
Ouvre mes yeux \xE0 ceux qui ont faim, qui sont seuls ou oubli\xE9s.
Donne-moi un c\u0153ur g\xE9n\xE9reux, et pourvois \xE0 ceux que je ne peux pas atteindre.
Je prie pour la justice, le pain quotidien et la dignit\xE9 des pauvres.
Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Christian teaching pages on mercy and Matthew 25; Christianity.com / Crosswalk compassion and generosity prayer themes. Original text.",url:"https://www.christianity.com/wiki/prayer/"},theme:"For others"},{id:"ev:faith-jesus",title:{fr:"Le chemin, la v\xE9rit\xE9 et la vie",en:"The Way, the Truth, and the Life"},refs:["John 14:6","John 3:16","Romans 10:9"],refsFr:["Jean 14:6","Jean 3:16","Romains 10:9"],text:{en:`Jesus, you are the way, the truth, and the life; no one comes to the Father but by you.
God so loved the world that he gave his only begotten Son, that whoever believes in him should not perish, but have everlasting life.
I confess with my mouth the Lord Jesus, and believe in my heart that God has raised him from the dead.
Hold me in this faith, and draw those I love to the same hope.
I trust you for salvation, today and forever.
In your name, amen.`,fr:`J\xE9sus, tu es le chemin, la v\xE9rit\xE9 et la vie; nul ne vient au P\xE8re que par toi.
Dieu a tant aim\xE9 le monde qu'il a donn\xE9 son Fils unique, afin que quiconque croit en lui ne p\xE9risse point, mais qu'il ait la vie \xE9ternelle.
Je confesse de ma bouche le Seigneur J\xE9sus, et je crois dans mon c\u0153ur que Dieu l'a ressuscit\xE9 des morts.
Tiens-moi dans cette foi, et attire \xE0 la m\xEAme esp\xE9rance ceux que j'aime.
Je me confie en toi pour le salut, aujourd'hui et pour toujours.
En ton nom, amen.`},inspiredBy:{platform:"web",source:"Christianity.com prayers of faith and salvation; the classic gospel verses used across churches. Original prayer, not a copied modern formula from a site.",url:"https://www.christianity.com/wiki/prayer/"},theme:"Faith in Jesus"},{id:"ev:look-to-jesus",title:{fr:"Les regards sur J\xE9sus",en:"Looking unto Jesus"},refs:["Hebrews 12:2"],refsFr:["H\xE9breux 12:2"],text:{en:`I look unto Jesus, the author and finisher of my faith, who for the joy set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God.
When I am distracted or discouraged, lift my eyes to him again.
He began this faith, and he will finish it.
Keep me near the cross and near the risen Lord.
My hope is in Jesus, not in myself.
In his name, amen.`,fr:`J'ai les regards sur J\xE9sus, le chef et le consommateur de la foi, qui, en vue de la joie qui lui \xE9tait r\xE9serv\xE9e, a souffert la croix, m\xE9pris\xE9 l'ignominie, et s'est assis \xE0 la droite du tr\xF4ne de Dieu.
Quand je suis distrait ou d\xE9courag\xE9, rel\xE8ve encore mes yeux vers lui.
C'est lui qui a commenc\xE9 cette foi, et c'est lui qui l'ach\xE8vera.
Garde-moi pr\xE8s de la croix et pr\xE8s du Seigneur ressuscit\xE9.
Mon esp\xE9rance est en J\xE9sus, non en moi-m\xEAme.
En son nom, amen.`},inspiredBy:{platform:"web",source:"Christian discipleship and faith articles citing Heb 12:1-2 (Christianity.com / Crosswalk). Original prayer.",url:"https://www.christianity.com/wiki/prayer/"},theme:"Faith in Jesus"},{id:"ev:temptation",title:{fr:"Le moyen de sortir de la tentation",en:"A Way of Escape in Temptation"},refs:["1 Corinthians 10:13","Matthew 26:41"],refsFr:["1 Corinthiens 10:13","Matthieu 26:41"],text:{en:`No temptation has taken me but such as is common to people; you are faithful, and will not suffer me to be tempted above what I am able, but will with the temptation also make a way to escape.
I watch and pray, that I may not enter into temptation; the spirit is willing, but the flesh is weak.
Show me the way out, and give me the will to take it.
Guard my eyes, my mouth, and my heart today.
I depend on your faithfulness, not on my resolve alone.
In Jesus' name, amen.`,fr:`Aucune tentation ne m'est survenue qui n'ait \xE9t\xE9 humaine; tu es fid\xE8le, et tu ne permettras pas que je sois tent\xE9 au-del\xE0 de mes forces, mais avec la tentation tu pr\xE9pareras aussi le moyen d'en sortir.
Je veille et je prie, afin de ne pas tomber dans la tentation; l'esprit est bien dispos\xE9, mais la chair est faible.
Montre-moi la porte de sortie, et donne-moi la volont\xE9 de la prendre.
Garde mes yeux, ma bouche et mon c\u0153ur aujourd'hui.
Je m'appuie sur ta fid\xE9lit\xE9, non sur ma seule r\xE9solution.

Let no corrupt communication proceed out of my mouth, but that which is good to edify, that it may minister grace to those who hear.

Give me words that build up, not words that wound.
Be the rock of my speech today.

Au nom de J\xE9sus, amen.`},inspiredBy:{platform:"web",source:"Common devotional use of Ps 19:14 (Psaumes 19:15 LSG) and Eph 4:29 in speech/integrity articles. Original prayer.",url:"https://www.christianity.com/wiki/prayer/"},theme:"Speech"},{id:"ev:grief",title:{fr:"Pr\xE8s de ceux qui ont le c\u0153ur bris\xE9",en:"Near to the Brokenhearted"},refs:["Psalm 34:18","Matthew 5:4"],refsFr:["Psaumes 34:19","Matthieu 5:4"],text:{en:`You are nigh unto them that are of a broken heart, and you save such as be of a contrite spirit.

Guide my steps. Give me wisdom in my choices, patience in hard moments, and a heart that is quick to love and to forgive.
Keep my family and the people I love under your protection.
Let your peace go with me, and may everything I do today honor you.
In the name of Jesus, amen.`}},{id:"ex:evening",icon:"\u{1F319}",title:{fr:"Pri\xE8re du soir",en:"Evening Prayer (Bedtime)"},ref:{fr:"Psaume 4:9",en:"Psalm 4:8"},text:{fr:`P\xE8re, merci pour cette journ\xE9e que tu m\u2019as donn\xE9e.

Veille cette nuit sur ma famille et sur ceux que j\u2019aime, et console ceux qui sont malades, seuls ou dans la peine.
Donne-moi un sommeil paisible et un vrai repos, et r\xE9veille-moi demain pr\xEAt \xE0 te servir.
Au nom de J\xE9sus, amen.`,en:`Father, thank you for this day you have given me.

I place in your hands everything that worries me; I trust you with tomorrow.
Watch over my family and the people I love tonight, and comfort those who are sick, alone or hurting.
Give me peaceful sleep and true rest, and wake me tomorrow ready to serve you.
In the name of Jesus, amen.`}},{id:"ex:lord",icon:"\u271D",title:{fr:"Notre P\xE8re (Matthieu 6:9-13, LSG)",en:"The Lord\u2019s Prayer (Matthew 6:9-13, KJV)"},ref:{fr:"Matthieu 6:9-13",en:"Matthew 6:9-13"},text:{get fr(){return np("fr")},get en(){return np("en")}}}],jg=e=>uu.find(n=>n.id===e);sr=(e,n)=>Cf(e.text[n]||"").map((t,r)=>({text:t,lang:n,key:`pr:${e.key}:${n}:${r}`,label:e.title[n]||""})),Jg=(e,n)=>{try{return new Date(e).toLocaleDateString(n==="en"?"en-US":"fr-FR",{day:"numeric",month:"short",year:"numeric"})}catch{return e.slice(0,10)}};tp=e=>String(e).padStart(2,"0"),Dg=()=>{let e=new Date;return`${e.getFullYear()}-${tp(e.getMonth()+1)}-${tp(e.getDate())}`};nu=null,ap=e=>nu&&nu(e);bt=(e,n)=>{let t=n.message.trim()||un(e,"C\u2019est l\u2019heure de lire ta Bible \u{1F4D6}","Time to read your Bible \u{1F4D6}"),r=un(e,"Touchez pour ouvrir Bible Explorer","Tap to open Bible Explorer"),o=n.prayerId?Pn(n.prayerId,e):null;return{title:t,body:r,pt:o&&o.title[o.lang]||"",px:o&&o.text[o.lang]||""}}});var Og=Ze(()=>{var up=Nt(Zm());lp();var cp=Nt(uo());(0,up.createRoot)(document.getElementById("root")).render((0,cp.jsx)(cu,{}))});Og();})();
