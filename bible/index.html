75px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-750x1334.jpg"><link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-640x1136.jpg"><link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-2048x2732.jpg"><link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-1668x2388.jpg"><link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-1640x2360.jpg"><link rel="apple-touch-startup-image" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-1620x2160.jpg"><style>:root{--bg:#f4f6f9;--card:#fff;--text:#14171c;--muted:#5b6472;--border:#d5dae1;--accent:#7a4b12;--accentBg:#f6ecdf;--mark:#ffe38a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#1a1f27;--text:#eef1f5;--muted:#9aa4b2;--border:#343b46;--accent:#e9b76a;--accentBg:#2d2416;--mark:#6b5414}}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.page{max-width:980px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:30px;margin:6px 0 4px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:4px 0 8px}
.muted{color:var(--muted);font-size:15px;line-height:22px;margin:4px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>label,.row>input,.row>select{flex:1 1 240px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:17px;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);width:100%}
select.narrow{flex:0 0 96px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;gap:6px;margin-top:12px;background:var(--bg);border-radius:12px;padding:4px;border:1px solid var(--border)}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--text);font:inherit;font-weight:600}
.seg button.on{background:var(--accent);color:var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}.btn:disabled{opacity:.4}.btn.wide{width:100%;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.callout{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accentBg);line-height:22px}
.hit{border-top:1px solid var(--border);padding:12px 0}.hit p{margin:6px 0;line-height:25px;font-size:17px}
.hit.study{background:var(--accentBg);border-radius:12px;padding:12px;border:0;margin:8px 0}
.hitref{font-weight:700}.tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media (max-width:640px){.cols{grid-template-columns:1fr}}
.passage{margin-top:12px}.verses p{margin:0 0 8px;line-height:26px;font-size:17px}sup{color:var(--accent);font-weight:700;font-size:11px}
.disclosure{width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;font-size:18px;font-weight:650;min-height:44px;padding:0}
.count{margin:12px 0 4px}.foot{text-align:center;font-size:13px}
.hero{display:flex;justify-content:center;margin:0 0 -4px}.logo{width:min(300px,62vw);height:auto;border-radius:20px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;background:var(--bg);padding:6px 0}
.tabs button{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:700;font-size:16px}
.tabs button.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
.small{font-size:13px}
.icon{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:20px;line-height:1;cursor:pointer;padding:0 8px}
.icon.on{color:#d39b1d;border-color:#d39b1d}.icon.big{min-width:56px;font-size:24px}
.vact{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle;float:right}
.verses .vact .icon{min-width:38px;min-height:38px;font-size:17px}
.verses p{overflow:hidden}
.speaking{background:var(--mark);border-radius:8px;outline:4px solid var(--mark)}
.flash{animation:fl 1.6s ease}@keyframes fl{0%,60%{background:var(--mark)}100%{background:transparent}}
.btns.top{margin-top:0;align-items:center}.savewrap{display:inline-flex;align-items:center;gap:6px}
.btn.danger{background:#c62828;color:#fff;border-color:#c62828}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;font-size:17px;padding:6px 0;cursor:pointer;text-align:left}
textarea.note{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-top:8px}
.notetext{background:var(--bg);border-radius:10px;padding:8px 10px}
.hit.saved{padding:14px 0}.backup{border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:10px 16px max(10px,env(safe-area-inset-bottom))}
.pinfo{max-width:980px;margin:0 auto 6px}.pctl{max-width:980px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pctl select.rate{width:auto;min-height:44px;flex:0 0 auto}
.vopts{max-width:980px;margin:10px auto 0}.chk{flex-direction:row;align-items:center;gap:10px;font-weight:600;color:var(--text);margin-bottom:8px}.chk input{width:22px;min-height:22px}
.hint{max-width:980px;margin:8px auto 0;font-size:14px;background:var(--accentBg);border-radius:10px;padding:8px 10px}
.page{padding-bottom:170px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:30;background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#splash{position:fixed;inset:0;z-index:100;background:#020a1e;display:flex;align-items:center;justify-content:center;transition:opacity .35s}#splash img{width:min(70vw,420px);border-radius:24px}#splash.gone{opacity:0;pointer-events:none}
.cols.three{grid-template-columns:1fr 1fr 1fr}@media (max-width:820px){.cols.three{grid-template-columns:1fr}}
.amcol .verses p{font-family:"Noto Sans Ethiopic","Abyssinica SIL",system-ui,sans-serif}
.tabs button{font-size:14px;padding:4px 2px;line-height:1.15}
.xfilter,.amtoggle{margin-top:12px;font-weight:600}
.xgroup{margin-top:14px}.xgh{border-bottom:2px solid var(--accent);padding-bottom:4px;margin-top:18px}
.xbook{border-top:1px solid var(--border);padding:12px 0}.xtitle{font-size:18px}
.churches{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.church{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accentBg);color:var(--accent)}
.church.c-cat{background:#e3ecfa;color:#1d4f9a}.church.c-ort{background:#f7e6e6;color:#8f1d1d}.church.c-éth{background:#e5f3e8;color:#1f6b33}
@media (prefers-color-scheme:dark){.church.c-cat{background:#1c2a44;color:#9cc0ff}.church.c-ort{background:#3a1d1d;color:#ffb4b4}.church.c-éth{background:#1a3322;color:#9be0ad}}
.xnote{margin:6px 0;line-height:22px;font-size:15px}.src{line-height:20px}.na{color:#b3261e;font-weight:600}
.tag.warn{color:#b3261e;border-color:#b3261e}.tag.xtag{color:var(--accent);border-color:var(--accent)}
.lic{background:var(--bg);border-radius:10px;padding:8px}
.missing ul{margin:8px 0 0;padding-left:20px}.missing li{margin:6px 0;line-height:21px}
.ethlist{padding-left:34px;margin:8px 0}.ethlist li{padding:7px 0;border-bottom:1px solid var(--border);line-height:22px}
.ethname{font-weight:650}.ethlinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.am{margin-left:8px;color:var(--muted)}
.btn.sm{min-height:38px;padding:4px 10px;font-size:14px}
.unavail{font-size:15px}
/* iOS / PWA */
html{-webkit-user-select:auto}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overscroll-behavior-y:none}
.page{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.install ol{margin:0 0 6px;padding-left:22px;line-height:26px}.install li{margin:4px 0}
.shareico{display:inline-block;border:1px solid var(--border);border-radius:6px;padding:0 6px;font-weight:700}
.offline{text-align:center}
input,select,textarea{font-size:17px}
.tabs{top:env(safe-area-inset-top)}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bg);z-index:6}

,referenceFr:"Matthieu 6:5-13",bibleQueryEn:"Matthew+6:5-13",bibleQueryFr:"Matthieu+6:5-13",topic:"Prayer / Pri\xE8re",textEn:"But when you pray, go into your room, close the door and pray to your Father, who is unseen... This, then, is how you should pray: 'Our Father in heaven, hallowed be your name, your kingdom come, your will be done, on earth as it is in heaven. Give us today our daily bread. And forgive us our debts, as we also have forgiven our debtors. And lead us not into temptation, but deliver us from the evil one.'",textFr:"Mais quand tu pries, entre dans ta chambre, ferme ta porte, et prie ton P\xE8re qui est l\xE0 dans le lieu secret... Voici donc comment vous devez prier : Notre P\xE8re qui es aux cieux ! Que ton nom soit sanctifi\xE9 ; que ton r\xE8gne vienne ; que ta volont\xE9 soit faite sur la terre comme au ciel. Donne-nous aujourd'hui notre pain quotidien ; pardonne-nous nos offenses, comme nous aussi nous pardonnons \xE0 ceux qui nous ont offens\xE9s ; ne nous induis pas en tentation, mais d\xE9livre-nous du malin.",noteEn:"Jesus teaches the Lord's Prayer and warns against praying for show.",noteFr:"J\xE9sus enseigne le Notre P\xE8re et demande de prier avec sinc\xE9rit\xE9 dans le secret.",mentionsJesus:!0},{id:"luke-11-1-13",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"Luke 11:1-13",referenceFr:"Luc 11:1-13",bibleQueryEn:"Luke+11:1-13",bibleQueryFr:"Luc+11:1-13",topic:"Prayer / Pri\xE8re",textEn:"So I say to you: Ask and it will be given to you; seek and you will find; knock and the door will be opened to you. For everyone who asks receives; the one who seeks finds; and to the one who knocks, the door will be opened.",textFr:"Et moi, je vous dis : Demandez, et l'on vous donnera ; cherchez, et vous trouverez ; frappez, et l'on vous ouvrira. Car quiconque demande re\xE7oit, celui qui cherche trouve, et l'on ouvre \xE0 celui qui frappe.",noteEn:"Jesus encourages persistent, trusting prayer after the disciples ask, 'Lord, teach us to pray.'",noteFr:"J\xE9sus encourage la pers\xE9v\xE9rance dans la pri\xE8re apr\xE8s que ses disciples lui ont demand\xE9 : \xAB Seigneur, enseigne-nous \xE0 prier. \xBB",mentionsJesus:!0},{id:"phil-4-6-7",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"Philippians 4:6-7",referenceFr:"Philippiens 4:6-7",bibleQueryEn:"Philippians+4:6-7",bibleQueryFr:"Philippiens+4:6-7",topic:"Prayer / Pri\xE8re",textEn:"Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God. And the peace of God, which transcends all understanding, will guard your hearts and your minds in Christ Jesus.",textFr:"Ne vous inqui\xE9tez de rien ; mais en toute chose faites conna\xEEtre vos besoins \xE0 Dieu par des pri\xE8res et des supplications, avec des actions de gr\xE2ces. Et la paix de Dieu, qui surpasse toute intelligence, gardera vos c\u0153urs et vos pens\xE9es en J\xE9sus-Christ.",noteEn:"Paul links prayer and gratitude directly to inner peace in Christ.",noteFr:"Paul relie la pri\xE8re et la gratitude \xE0 la paix int\xE9rieure en J\xE9sus-Christ.",mentionsJesus:!0},{id:"1-thess-5-16-18",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"1 Thessalonians 5:16-18",referenceFr:"1 Thessaloniciens 5:16-18",bibleQueryEn:"1+Thessalonians+5:16-18",bibleQueryFr:"1+Thessaloniciens+5:16-18",topic:"Prayer / Pri\xE8re",textEn:"Rejoice always, pray continually, give thanks in all circumstances; for this is God's will for you in Christ Jesus.",textFr:"Soyez toujours joyeux. Priez sans cesse. Rendez gr\xE2ces en toutes choses, car c'est \xE0 votre \xE9gard la volont\xE9 de Dieu en J\xE9sus-Christ.",noteEn:"A call to keep a constant attitude of prayer and gratitude throughout daily life.",noteFr:"Un appel \xE0 garder un lien constant de pri\xE8re et de reconnaissance avec Dieu.",mentionsJesus:!0},{id:"james-5-13-16",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"James 5:13-16",referenceFr:"Jacques 5:13-16",bibleQueryEn:"James+5:13-16",bibleQueryFr:"Jacques+5:13-16",topic:"Prayer / Pri\xE8re",textEn:"Therefore confess your sins to each other and pray for each other so that you may be healed. The prayer of a righteous person is powerful and effective.",textFr:"Confessez donc vos p\xE9ch\xE9s les uns aux autres, et priez les uns pour les autres, afin que vous soyez gu\xE9ris. La pri\xE8re fervente du juste a une grande efficace.",noteEn:"Connects mutual confession, intercessory prayer, and healing.",noteFr:"Relie la confession mutuelle, l'intercession et la gu\xE9rison.",mentionsJesus:!1},{id:"psalm-145-18",tradition:"Judaism & Christianity (Tanakh / Old Testament)",collection:"Old Testament / Tanakh",referenceEn:"Psalm 145:18",referenceFr:"Psaume 145:18",bibleQueryEn:"Psalm+145:18",bibleQueryFr:"Psaume+145:18",topic:"Prayer / Pri\xE8re",textEn:"The Lord is near to all who call on him, to all who call on him in truth.",textFr:"L'\xC9ternel est pr\xE8s de tous ceux qui l'invoquent, de tous ceux qui l'invoquent avec sinc\xE9rit\xE9.",noteEn:"Hebrew scripture emphasizes sincerity of heart when calling upon God.",noteFr:"Les Psaumes insistent sur la sinc\xE9rit\xE9 du c\u0153ur lorsqu'on invoque Dieu.",mentionsJesus:!1},{id:"isaiah-53-3-5",tradition:"Judaism & Christianity (Tanakh / Old Testament)",collection:"Old Testament / Tanakh",referenceEn:"Isaiah 53:3-5",referenceFr:"\xC9sa\xEFe 53:3-5",bibleQueryEn:"Isaiah+53:1-12",bibleQueryFr:"Esaie+53:1-12",topic:"Jesus / J\xE9sus",textEn:"He was despised and rejected by mankind, a man of suffering, and familiar with pain... But he was pierced for our transgressions, he was crushed for our iniquities; the punishment that brought us peace was on him, and by his wounds we are healed.",textFr:"M\xE9pris\xE9 et abandonn\xE9 des hommes, homme de douleur et habitu\xE9 \xE0 la souffrance... Mais il \xE9tait bless\xE9 pour nos p\xE9ch\xE9s, bris\xE9 pour nos iniquit\xE9s ; le ch\xE2timent qui nous donne la paix est tomb\xE9 sur lui, et c'est par ses meurtrissures que nous sommes gu\xE9ris.",noteEn:"The Suffering Servant song in Isaiah, read in the New Testament as a central prophecy of Jesus's passion.",noteFr:"Le chant du Serviteur souffrant dans \xC9sa\xEFe, lu dans le Nouveau Testament comme une proph\xE9tie de la passion de J\xE9sus.",mentionsJesus:!0},{id:"john-1-1-14",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"John 1:1-14",referenceFr:"Jean 1:1-14",bibleQueryEn:"John+1:1-14",bibleQueryFr:"Jean+1:1-14",topic:"Jesus / J\xE9sus",textEn:"In the beginning was the Word, and the Word was with God, and the Word was God... The Word became flesh and made his dwelling among us. We have seen his glory, the glory of the one and only Son, who came from the Father, full of grace and truth.",textFr:"Au commencement \xE9tait la Parole, et la Parole \xE9tait avec Dieu, et la Parole \xE9tait Dieu... Et la Parole a \xE9t\xE9 faite chair, et elle a habit\xE9 parmi nous, pleine de gr\xE2ce et de v\xE9rit\xE9 ; et nous avons contempl\xE9 sa gloire, une gloire comme la gloire du Fils unique venu du P\xE8re.",noteEn:"John presents Jesus as the eternal Logos (Word) of God made flesh.",noteFr:"Jean pr\xE9sente J\xE9sus comme la Parole \xE9ternelle (Logos) de Dieu devenue chair.",mentionsJesus:!0},{id:"john-3-16-17",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"John 3:16-17",referenceFr:"Jean 3:16-17",bibleQueryEn:"John+3:16-17",bibleQueryFr:"Jean+3:16-17",topic:"Jesus / J\xE9sus",textEn:"For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life. For God did not send his Son into the world to condemn the world, but to save the world through him.",textFr:"Car Dieu a tant aim\xE9 le monde qu'il a donn\xE9 son Fils unique, afin que quiconque croit en lui ne p\xE9risse point, mais qu'il ait la vie \xE9ternelle. Dieu, en effet, n'a pas envoy\xE9 son Fils dans le monde pour qu'il juge le monde, mais pour que le monde soit sauv\xE9 par lui.",noteEn:"Summary of the Christian Gospel: God's love expressed through sending Jesus for salvation.",noteFr:"R\xE9sum\xE9 de l'\xC9vangile chr\xE9tien : l'amour de Dieu manifest\xE9 par l'envoi de J\xE9sus pour le salut du monde.",mentionsJesus:!0},{id:"john-14-6",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"John 14:6",referenceFr:"Jean 14:6",bibleQueryEn:"John+14:1-14",bibleQueryFr:"Jean+14:1-14",topic:"Jesus / J\xE9sus",textEn:"Jesus answered, 'I am the way and the truth and the life. No one comes to the Father except through me.'",textFr:"J\xE9sus lui dit : Je suis le chemin, la v\xE9rit\xE9, et la vie. Nul ne vient au P\xE8re que par moi.",noteEn:"Jesus's statement to Thomas on the night before his crucifixion.",noteFr:"Parole de J\xE9sus \xE0 Thomas la veille de sa crucifixion.",mentionsJesus:!0},{id:"quran-3-45-49",tradition:"Islam (Quran)",collection:"Quran / Coran",referenceEn:"Quran 3:45-49 (Ali 'Imran)",referenceFr:"Coran 3:45-49 (Al-Imran)",topic:"Jesus / J\xE9sus",textEn:"Behold! The angels said: 'O Mary! God gives you glad tidings of a Word from Him: his name will be the Messiah, Jesus, the son of Mary, held in honor in this world and the Hereafter and of those nearest to God... I will heal the blind and the leper, and I will bring the dead to life by God's permission.'",textFr:"Rappelle-toi quand les Anges dirent : \xAB \xD4 Marie, voil\xE0 qu'Allah t'annonce une parole de Sa part : son nom sera al-Masih (le Messie), Issa (J\xE9sus), fils de Marie, illustre ici-bas comme dans l'au-del\xE0, et l'un des rapproch\xE9s d'Allah... Je gu\xE9ris l'aveugle-n\xE9 et le l\xE9preux, et je ressuscite les morts, par la permission d'Allah. \xBB",noteEn:"The Quran honors Jesus (Isa) as the Messiah, born of the Virgin Mary, a Word from God, and worker of miracles by God's leave.",noteFr:"Le Coran honore J\xE9sus (Issa) comme le Messie, n\xE9 de la Vierge Marie, Parole de Dieu accomplissant des miracles par Sa permission.",mentionsJesus:!0},{id:"quran-19-30-34",tradition:"Islam (Quran)",collection:"Quran / Coran",referenceEn:"Quran 19:30-34 (Maryam)",referenceFr:"Coran 19:30-34 (Maryam)",topic:"Jesus / J\xE9sus",textEn:"He [Jesus] said: 'Indeed, I am the servant of God. He has given me the Scripture and made me a prophet. And He has made me blessed wherever I am and has enjoined upon me prayer and charity as long as I remain alive... Peace is on me the day I was born, the day I will die, and the day I am raised alive.'",textFr:"Il [J\xE9sus] dit : \xAB Je suis vraiment le serviteur d'Allah. Il m'a donn\xE9 le Livre et m'a d\xE9sign\xE9 Proph\xE8te. O\xF9 que je sois, Il m'a rendu b\xE9ni ; et Il m'a recommand\xE9, tant que je vivrai, la pri\xE8re et la Zakat... Et que la paix soit sur moi le jour o\xF9 je naquis, le jour o\xF9 je mourrai, et le jour o\xF9 je serai ressuscit\xE9 vivant. \xBB",noteEn:"In Surah Maryam, the infant Jesus speaks to defend his mother Mary and declares his prophetic mission.",noteFr:"Dans la sourate Maryam, J\xE9sus parle d\xE8s le berceau pour d\xE9fendre sa m\xE8re Marie et annoncer sa mission proph\xE9tique.",mentionsJesus:!0},{id:"gospel-thomas-3-77",tradition:"Non-Canonical Christian / Gnostic",collection:"Apocrypha & Ancient Texts",referenceEn:"Gospel of Thomas, Logion 3 & 77 (Nag Hammadi)",referenceFr:"\xC9vangile selon Thomas, Logion 3 & 77 (Nag Hammadi)",topic:"Jesus / J\xE9sus",textEn:"Jesus said: 'The Kingdom is inside of you, and it is outside of you. When you come to know yourselves, then you will become known, and you will realize that it is you who are the sons of the living Father... Split a piece of wood, and I am there. Lift up the stone, and you will find me there.'",textFr:"J\xE9sus a dit : \xAB Le Royaume est au-dedans de vous, et il est au-dehors de vous. Lorsque vous vous conna\xEEtrez vous-m\xEAmes, alors vous serez connus et vous saurez que vous \xEAtes les fils du P\xE8re vivant... Fends le bois, je suis l\xE0 ; l\xE8ve la pierre, et tu me trouveras l\xE0. \xBB",noteEn:"Sayings collection discovered at Nag Hammadi in 1945, emphasizing inward spiritual awakening.",noteFr:"Recueil de paroles d\xE9couvert \xE0 Nag Hammadi en 1945, mettant l'accent sur la pr\xE9sence int\xE9rieure du Royaume.",mentionsJesus:!0},{id:"josephus-antiquities-18-63",tradition:"Ancient Historical Sources",collection:"Apocrypha & Ancient Texts",referenceEn:"Flavius Josephus, Antiquities of the Jews 18.3.3 (c. 93 AD)",referenceFr:"Flavius Jos\xE8phe, Antiquit\xE9s juda\xEFques 18.3.3 (v. 93 apr. J.-C.)",topic:"Jesus / J\xE9sus",textEn:"Around this time lived Jesus, a wise man... For he was one who wrought surprising feats and was a teacher of such people as accept the truth gladly. He won over many Jews and many of the Greeks... And when Pilate, upon hearing him accused by men of the highest standing amongst us, had condemned him to be crucified, those who had in the first place come to love him did not give up their affection for him.",textFr:"Vers ce m\xEAme temps v\xE9cut J\xE9sus, un homme sage... Car il accomplissait des \u0153uvres surprenantes et enseignait les hommes qui recevaient la v\xE9rit\xE9 avec joie. Il attira \xE0 lui beaucoup de Juifs et beaucoup de Grecs... Et lorsque Pilate, sur l'accusation des premiers d'entre nous, l'eut condamn\xE9 \xE0 la croix, ceux qui l'avaient aim\xE9 d\xE8s le commencement ne cess\xE8rent pas de lui rester attach\xE9s.",noteEn:"First-century Jewish historian confirming Jesus's life, reputation as a teacher and wonder-worker, and crucifixion under Pontius Pilate.",noteFr:"Historien juif du Ier si\xE8cle confirmant l'existence de J\xE9sus, son minist\xE8re d'enseignant et sa crucifixion sous Ponce Pilate.",mentionsJesus:!0},{id:"tacitus-annals-15-44",tradition:"Ancient Historical Sources",collection:"Apocrypha & Ancient Texts",referenceEn:"Tacitus, Annals 15.44 (c. 116 AD)",referenceFr:"Tacite, Annales 15.44 (v. 116 apr. J.-C.)",topic:"Jesus / J\xE9sus",textEn:"Christus, from whom the name [Christians] had its origin, suffered the extreme penalty during the reign of Tiberius at the hands of one of our procurators, Pontius Pilatus...",textFr:"Ce nom [chr\xE9tiens] leur vient de Christ, qui, sous le r\xE8gne de Tib\xE8re, fut livr\xE9 au supplice par le procurateur Ponce Pilate...",noteEn:"Roman senator and historian independently attesting to the execution of Jesus under Pontius Pilate during Emperor Tiberius's reign.",noteFr:"S\xE9nateur et historien romain attestant de mani\xE8re ind\xE9pendante l'ex\xE9cution de J\xE9sus sous Ponce Pilate.",mentionsJesus:!0},{id:"gen-2-24",tradition:"Judaism & Christianity (Tanakh / Old Testament)",collection:"Old Testament / Tanakh",referenceEn:"Genesis 2:24",referenceFr:"Gen\xE8se 2:24",bibleQueryEn:"Genesis+2:18-25",bibleQueryFr:"Genese+2:18-25",topic:"Marriage / Mariage",textEn:"That is why a man leaves his father and mother and is united to his wife, and they become one flesh.",textFr:"C'est pourquoi l'homme quittera son p\xE8re et sa m\xE8re, et s'attachera \xE0 sa femme, et ils deviendront une seule chair.",noteEn:"Foundational biblical verse on marriage in the Torah, later quoted directly by Jesus in Matthew 19.",noteFr:"Verset fondateur de la Torah sur le mariage, repris par J\xE9sus dans Matthieu 19.",mentionsJesus:!1},{id:"mark-10-6-9",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"Mark 10:6-9",referenceFr:"Marc 10:6-9",bibleQueryEn:"Mark+10:1-12",bibleQueryFr:"Marc+10:1-12",topic:"Marriage / Mariage",textEn:"But at the beginning of creation God 'made them male and female.' 'For this reason a man will leave his father and mother and be united to his wife, and the two will become one flesh.' So they are no longer two, but one flesh. Therefore what God has joined together, let no one separate.",textFr:"Mais au commencement de la cr\xE9ation, Dieu fit l'homme et la femme ; c'est pourquoi l'homme quittera son p\xE8re et sa m\xE8re, et s'attachera \xE0 sa femme, et les deux deviendront une seule chair. Ainsi ils ne sont plus deux, mais ils sont une seule chair. Que l'homme donc ne s\xE9pare pas ce que Dieu a joint.",noteEn:"Jesus affirms the permanence and sacred unity of marriage.",noteFr:"J\xE9sus affirme l'unit\xE9 sacr\xE9e et durable du mariage.",mentionsJesus:!0},{id:"1-cor-13-4-7",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"1 Corinthians 13:4-7",referenceFr:"1 Corinthiens 13:4-7",bibleQueryEn:"1+Corinthians+13:1-13",bibleQueryFr:"1+Corinthiens+13:1-13",topic:"Marriage / Mariage",textEn:"Love is patient, love is kind. It does not envy, it does not boast, it is not proud. It does not dishonor others, it is not self-seeking, it is not easily angered, it keeps no record of wrongs. Love does not delight in evil but rejoices with the truth. It always protects, always trusts, always hopes, always perseveres.",textFr:"La charit\xE9 (l'amour) est patiente, elle est pleine de bont\xE9 ; l'amour n'est point envieux ; l'amour ne se vante point, il ne s'enfle point d'orgueil, il ne fait rien de malhonn\xEAte, il ne cherche point son int\xE9r\xEAt, il ne s'irrite point, il ne soup\xE7onne point le mal, il ne se r\xE9jouit point de l'injustice, mais il se r\xE9jouit de la v\xE9rit\xE9 ; il excuse tout, il croit tout, il esp\xE8re tout, il supporte tout.",noteEn:"Paul's hymn to love, one of the most widely read passages at Christian weddings.",noteFr:"L'hymne \xE0 l'amour de Paul, passage central lu lors des mariages chr\xE9tiens.",mentionsJesus:!1},{id:"eph-5-25-33",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"Ephesians 5:25-33",referenceFr:"\xC9ph\xE9siens 5:25-33",bibleQueryEn:"Ephesians+5:21-33",bibleQueryFr:"Ephesiens+5:21-33",topic:"Marriage / Mariage",textEn:"Husbands, love your wives, just as Christ loved the church and gave himself up for her... However, each one of you also must love his wife as he loves himself, and the wife must respect her husband.",textFr:"Maris, aimez vos femmes, comme Christ a aim\xE9 l'\xC9glise, et s'est livr\xE9 lui-m\xEAme pour elle... Du reste, que chacun de vous aime sa femme comme lui-m\xEAme, et que la femme respecte son mari.",noteEn:"Frames marital love on self-giving sacrifice and mutual respect modeled on Christ.",noteFr:"Fonde l'amour conjugal sur le don de soi et le respect mutuel \xE0 l'image du Christ.",mentionsJesus:!0},{id:"psalm-51-1-10",tradition:"Judaism & Christianity (Tanakh / Old Testament)",collection:"Old Testament / Tanakh",referenceEn:"Psalm 51:1-10",referenceFr:"Psaume 51:1-12",bibleQueryEn:"Psalm+51:1-12",bibleQueryFr:"Psaume+51:1-12",topic:"Sin & Forgiveness / P\xE9ch\xE9 & Pardon",textEn:"Have mercy on me, O God, according to your unfailing love; according to your great compassion blot out my transgressions. Wash away all my iniquity and cleanse me from my sin... Create in me a pure heart, O God, and renew a steadfast spirit within me.",textFr:"\xD4 Dieu ! aie piti\xE9 de moi dans ta bont\xE9 ; selon ta grande mis\xE9ricorde, efface mes transgressions ; lave-moi compl\xE8tement de mon iniquit\xE9, et purifie-moi de mon p\xE9ch\xE9... \xD4 Dieu ! cr\xE9e en moi un c\u0153ur pur, renouvelle en moi un esprit bien dispos\xE9.",noteEn:"David's classic penitential psalm asking for forgiveness and inner transformation.",noteFr:"Le grand psaume de repentance de David demandant le pardon et un c\u0153ur nouveau.",mentionsJesus:!1},{id:"romans-3-23-24",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"Romans 3:23-24",referenceFr:"Romains 3:23-24",bibleQueryEn:"Romans+3:21-26",bibleQueryFr:"Romains+3:21-26",topic:"Sin & Forgiveness / P\xE9ch\xE9 & Pardon",textEn:"For all have sinned and fall short of the glory of God, and all are justified freely by his grace through the redemption that came by Christ Jesus.",textFr:"Car tous ont p\xE9ch\xE9 et sont priv\xE9s de la gloire de Dieu ; et ils sont gratuitement justifi\xE9s par sa gr\xE2ce, par le moyen de la r\xE9demption qui est en J\xE9sus-Christ.",noteEn:"Paul explains universal human sinfulness and free redemption through grace in Jesus.",noteFr:"Paul explique l'universalit\xE9 du p\xE9ch\xE9 humain et la justification gratuite par la gr\xE2ce en J\xE9sus-Christ.",mentionsJesus:!0},{id:"1-john-1-8-9",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"1 John 1:8-9",referenceFr:"1 Jean 1:8-9",bibleQueryEn:"1+John+1:5-10",bibleQueryFr:"1+Jean+1:5-10",topic:"Sin & Forgiveness / P\xE9ch\xE9 & Pardon",textEn:"If we claim to be without sin, we deceive ourselves and the truth is not in us. If we confess our sins, he is faithful and just and will forgive us our sins and purify us from all unrighteousness.",textFr:"Si nous disons que nous n'avons pas de p\xE9ch\xE9, nous nous s\xE9duisons nous-m\xEAmes, et la v\xE9rit\xE9 n'est point en nous. Si nous confessons nos p\xE9ch\xE9s, il est fid\xE8le et juste pour nous les pardonner, et pour nous purifier de toute iniquit\xE9.",noteEn:"Assurance that honest confession brings complete forgiveness and cleansing.",noteFr:"Promesse que la confession sinc\xE8re apporte le pardon et la purification.",mentionsJesus:!0},{id:"john-8-7-11",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"John 8:7-11",referenceFr:"Jean 8:7-11",bibleQueryEn:"John+8:1-11",bibleQueryFr:"Jean+8:1-11",topic:"Sin & Forgiveness / P\xE9ch\xE9 & Pardon",textEn:"He straightened up and said to them, 'Let any one of you who is without sin be the first to throw a stone at her.' ... 'Then neither do I condemn you,' Jesus declared. 'Go now and leave your life of sin.'",textFr:"Comme ils continuaient \xE0 l'interroger, il se releva et leur dit : Que celui de vous qui est sans p\xE9ch\xE9 jette le premier la pierre contre elle... J\xE9sus lui dit : Je ne te condamne pas non plus : va, et ne p\xE8che plus.",noteEn:"Jesus combines mercy toward the accused woman with a call to a transformed life.",noteFr:"J\xE9sus allie la mis\xE9ricorde envers la femme accus\xE9e \xE0 un appel \xE0 changer de vie.",mentionsJesus:!0},{id:"gen-1-1-3",tradition:"Judaism & Christianity (Tanakh / Old Testament)",collection:"Old Testament / Tanakh",referenceEn:"Genesis 1:1-3",referenceFr:"Gen\xE8se 1:1-3",bibleQueryEn:"Genesis+1",bibleQueryFr:"Genese+1",topic:"Creation & Wisdom / Cr\xE9ation & Sagesse",textEn:"In the beginning God created the heavens and the earth. Now the earth was formless and empty, darkness was over the surface of the deep, and the Spirit of God was hovering over the waters. And God said, 'Let there be light,' and there was light.",textFr:"Au commencement, Dieu cr\xE9a les cieux et la terre. La terre \xE9tait informe et vide : il y avait des t\xE9n\xE8bres \xE0 la surface de l'ab\xEEme, et l'esprit de Dieu se mouvait au-dessus des eaux. Dieu dit : Que la lumi\xE8re soit ! Et la lumi\xE8re fut.",noteEn:"Opening account of creation in Genesis / Bereishit.",noteFr:"R\xE9cit d'ouverture de la cr\xE9ation dans la Gen\xE8se (Berechit).",mentionsJesus:!1},{id:"enoch-48-2-6",tradition:"Non-Canonical Jewish / Ethiopian Canon",collection:"Apocrypha & Ancient Texts",referenceEn:"1 Enoch 48:2-6 (Similitudes of Enoch)",referenceFr:"1 H\xE9noch 48:2-6 (Livre des Paraboles)",topic:"Jesus / J\xE9sus",textEn:"And at that hour that Son of Man was named in the presence of the Lord of Spirits, and his name before the Head of Days. Yea, before the sun and the signs were created, before the stars of the heaven were made, his name was named before the Lord of Spirits. He shall be a staff to the righteous... and the light of the Gentiles.",textFr:"Et \xE0 cette heure-l\xE0, ce Fils de l'homme fut nomm\xE9 en pr\xE9sence du Seigneur des esprits, et son nom devant le Chef des jours. Avant que le soleil et les signes fussent cr\xE9\xE9s, avant que les \xE9toiles du ciel fussent faites, son nom fut prononc\xE9 devant le Seigneur des esprits. Il sera un b\xE2ton pour les justes... et la lumi\xE8re des nations.",noteEn:"Second-Temple text (canonical in the Ethiopian Orthodox Church) describing the pre-existent 'Son of Man,' a title Jesus frequently uses for himself in the Gospels.",noteFr:"Texte du Second Temple (canonique en \xC9thiopie) d\xE9crivant le \xAB Fils de l'homme \xBB pr\xE9existant, titre que J\xE9sus utilise souvent dans les \xC9vangiles.",mentionsJesus:!0},{id:"matt-7-12",tradition:"Christianity (New Testament)",collection:"New Testament",referenceEn:"Matthew 7:12",referenceFr:"Matthieu 7:12",bibleQueryEn:"Matthew+7:1-12",bibleQueryFr:"Matthieu+7:1-12",topic:"Creation & Wisdom / Cr\xE9ation & Sagesse",textEn:"So in everything, do to others what you would have them do to you, for this sums up the Law and the Prophets.",textFr:"Tout ce que vous voulez que les hommes fassent pour vous, faites-le de m\xEAme pour eux, car c'est la loi et les proph\xE8tes.",noteEn:"Jesus's formulation of the Golden Rule in the Sermon on the Mount.",noteFr:"La R\xE8gle d'or enseign\xE9e par J\xE9sus dans le Sermon sur la montagne.",mentionsJesus:!0}]});function ot(){let e=[];if(K){try{e=K.getVoices().map(t=>({name:t.name,locale:(t.lang||"").replace("_","-"),network:t.localService===!1}))}catch{}P.ready=!0}let n=new Set;e=e.filter(t=>n.has(t.name+t.locale)?!1:(n.add(t.name+t.locale),!0)),e.sort((t,r)=>t.locale.localeCompare(r.locale)||t.name.localeCompare(r.name)),P.voices=e,nn()}function jr(e){return El(e).length>0}function Ph(e){if(!K)return null;let n=K.getVoices(),t=e==="fr"?P.frVoice:e==="en"?P.enVoice:"";if(t){let s=n.find(u=>u.name===t);if(s)return s}let r=e==="fr"?"fr-fr":e==="am"?"am-et":"en-us",o=n.filter(s=>(s.lang||"").replace("_","-").toLowerCase().startsWith(e)),l=o.filter(s=>(s.lang||"").replace("_","-").toLowerCase()===r),i=e==="fr"?xh:e==="en"?Th:[];for(let s of i){let u=l.find(c=>c.name.toLowerCase().startsWith(s
